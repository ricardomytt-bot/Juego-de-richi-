<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Mike y las Estrellas Oscuras</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<div id="touch">
  <div class="pad dpad">
    <button data-k="ArrowUp" class="u">▲</button>
    <button data-k="ArrowLeft" class="l">◀</button>
    <button data-k="ArrowRight" class="r">▶</button>
    <button data-k="ArrowDown" class="d">▼</button>
  </div>
  <div class="pad right">
    <button data-k="KeyE">E</button>
    <button data-k="ShiftLeft">≫</button>
    <button data-k="KeyJ">⚔</button>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
<script src="js/render.js"></script>
<script src="js/story.js"></script>
</body>
</html>
