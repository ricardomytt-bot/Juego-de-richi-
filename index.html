<!DOCTYPE html>

<head>

  #b-der   { left: 108px; bottom: 20px; width: 78px; height: 78px; }
  #b-salto { right: 18px; bottom: 22px; width: 96px; height: 96px; background: rgba(60,180,90,.45); }
  #b-patada{ right: 130px; bottom: 26px; width: 78px; height: 78px; background: rgba(240,150,40,.45); }

<script>
// ============================================================
//  LICHILÓN Y LOS DEPARTAMENTOS  -  Versión 0.5
//  Historia: el Patrón y la Patrona subieron la renta de los departamentos.
//  Los tres hermanos tienen que derrotarlos para ganar su depa gratis.
//
//  Partes del código:
//   1. Personajes   2. Sonidos   3. Controles   4. Dibujos (niños, enemigos, jefes)
//   5. Escenario de Mérida   6. Niveles   7. Reglas del juego   8. Pantallas   9. Ciclo
// ============================================================

const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;                           // tamaño "lógico" del juego
const ESC = canvas.width / W;                     // el dibujo real es más grande para verse nítido
const T = 32;                                     // tamaño de cada bloque
const FILAS = 14;
const GRAVEDAD = 0.6;
const VIDAS_INICIO = 3, VIDAS_MAX = 5, CHOCOS_POR_VIDA = 3;
const BOTAS_DURACION = 900;                       // 15 segundos

// ---------- 1. PERSONAJES (cambia estos números para inventar ventajas) ----------
// Los tres primeros están desde el inicio. Los demás se desbloquean con logros.
const PERSONAJES = [
  { id: 'lichi', nombre: 'LICHILÓN', tipo: 'nino', estilo: 'lichi', vel: 3.4, salto: 13.6, caida: 1.0, maxCaida: 15, voz: 215,
    desc: ['Buen saltador y', 'bastante resistente.'], stats: { vel: 3, salto: 4, caida: 3 },
    piel: '#ffd7b5', pelo: ['#ffe680', '#e8b93a'], ojos: '#3b8de0', camisa: ['#5bd174', '#2c9d46'], pantalon: '#3f6fd1', zapato: '#f4f4f4' },
  { id: 'julian', nombre: 'JULIÁN CHÓN', tipo: 'nino', estilo: 'julian', vel: 4.1, salto: 12.2, caida: 1.0, maxCaida: 15, voz: 190,
    desc: ['El más rápido,', 'pero salta menos.'], stats: { vel: 4, salto: 2, caida: 3 },
    piel: '#f6c79a', pelo: ['#a56a3d', '#6b3f20'], ojos: '#6b4423', camisa: ['#ffe95e', '#f2b81c'], pantalon: '#2d4f8f', zapato: '#e04b3a' },
  { id: 'sofi', nombre: 'SOFI LOFI', tipo: 'nino', estilo: 'sofi', vel: 3.7, salto: 13.2, caida: 0.7, maxCaida: 7.5, voz: 330,
    desc: ['Cae más suave', 'que los demás.'], stats: { vel: 3, salto: 3, caida: 4 },
    piel: '#ffd7b5', pelo: ['#ffec7a', '#efc02a'], ojos: '#2f9e6a', camisa: ['#ff9ac7', '#ee5498'], pantalon: '#8e63d8', zapato: '#b04bd6' },
  { id: 'venadito', nombre: 'VENADITO', tipo: 'venado', logro: 'patron', pista: 'Derrota al Patrón', vel: 3.6, salto: 14.8, caida: 1.0, maxCaida: 15, voz: 270,
    desc: ['El venado de Yucatán.', 'Salta altísimo.'], stats: { vel: 3, salto: 5, caida: 3 },
    piel: '#d9a05b', pelo: ['#9a6a35', '#5e3a18'], ojos: '#4a2c14', camisa: ['#7ad0f5', '#2f9ad6'], pantalon: '#3a7d44', zapato: '#8a5a2b' },
  { id: 'chocolate', nombre: 'CHOCOLATE', tipo: 'perro', logro: 'choco30', pista: 'Recoge 30 Kit Kats', vel: 4.5, salto: 12.4, caida: 0.9, maxCaida: 13, voz: 300,
    desc: ['Un perrito veloz', 'y muy travieso.'], stats: { vel: 5, salto: 3, caida: 3 },
    piel: '#b06a30', pelo: ['#7a4620', '#4f2c10'], ojos: '#2a1a10', camisa: ['#ffa94d', '#ee7a0e'], pantalon: '#3b5bb5', zapato: '#f4f4f4' },
  { id: 'toh', nombre: 'EL TOH', tipo: 'toh', logro: 'serpientes', pista: 'Derrota 8 serpientes', vel: 3.9, salto: 12.8, caida: 0.4, maxCaida: 3.6, voz: 360,
    desc: ['El pájaro de Yucatán.', 'Planea al caer.'], stats: { vel: 4, salto: 3, caida: 5 },
    piel: '#34b9ab', pelo: ['#1f95a3', '#0f5e6b'], ojos: '#1a1a22', camisa: ['#e8a04a', '#b8661a'], pantalon: '#2f9a6b', zapato: '#f0b020' },
];

// ---------- AJUSTES Y DATOS GUARDADOS ----------
const CLAVE_GUARDADO = 'lichilon_departamentos_v1';
const AJ_DEFECTO = { musica: 0.6, efectos: 0.8, texto: 1, temblor: true, botones: 'auto' };
const datos = { ajustes: { ...AJ_DEFECTO }, logros: {}, stats: {}, mejor: 0 };
try {
  const j = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || 'null');
  if (j) { Object.assign(datos.ajustes, j.ajustes || {}); datos.logros = j.logros || {}; datos.stats = j.stats || {}; datos.mejor = j.mejor || 0; }
} catch (e) {}
function guardarDatos() { try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(datos)); return true; } catch (e) { return false; } }
let aj = { ...datos.ajustes };                              // ajustes en uso (se pueden mover sin guardar)
function guardarAjustes() { datos.ajustes = { ...aj }; return guardarDatos(); }
function descartarAjustes() { aj = { ...datos.ajustes }; aplicarVolumen(); }

// ---------- 2. SONIDOS Y MÚSICA (todo se fabrica con código, no hay archivos) ----------
let audioCtx = null, silencio = false, master = null, busSfx = null, busMusica = null, convolver = null, bufRuido = null;
function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); crearBuses(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function crearBuses() {
  const a = audioCtx; master = a.createGain();
  const comp = a.createDynamicsCompressor(); master.connect(comp); comp.connect(a.destination);
  busSfx = a.createGain(); busSfx.connect(master); busMusica = a.createGain(); busMusica.connect(master);
  convolver = a.createConvolver();
  const n = Math.floor(a.sampleRate * 1.7), buf = a.createBuffer(2, n, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
  convolver.buffer = buf; const rev = a.createGain(); rev.gain.value = 0.35; convolver.connect(rev); rev.connect(master);
  const rb = a.createBuffer(1, a.sampleRate, a.sampleRate), rd = rb.getChannelData(0); for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1; bufRuido = rb;
  aplicarVolumen();
}
function aplicarVolumen() { if (!audioCtx) return; master.gain.value = silencio ? 0 : 1; busSfx.gain.value = aj.efectos; busMusica.gain.value = aj.musica; }

function tono(f1, f2, dur, tipo = 'square', vol = 0.08, retraso = 0) {
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + retraso, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(busSfx); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ruido(dur, vol = 0.1, filtro = 1200, tipoFiltro = 'lowpass', retraso = 0) {
  const a = audio(); if (!a) return;
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t0 = a.currentTime + retraso;
  f.type = tipoFiltro; f.frequency.value = filtro; s.buffer = bufRuido;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(busSfx); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}
// Voz de "¡ouch!": una vocal que se desliza de "o" a "u" y termina con un "ch"
function voz(grave) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, dur = 0.42, o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(grave * 1.5, t); o.frequency.exponentialRampToValueAtTime(grave * 0.85, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[780, 430, 1], [1220, 780, 0.55]].forEach(([f0, f1, amp]) => {
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 7; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const ga = a.createGain(); ga.gain.value = amp; o.connect(f); f.connect(ga); ga.connect(g);
  });
  g.connect(busSfx); o.start(t); o.stop(t + dur + 0.03);
  ruido(0.09, 0.22, 3500, 'highpass', dur - 0.06);
}
const SONIDOS = {
  salto:   () => { tono(300, 760, 0.17, 'triangle', 0.1); tono(600, 1200, 0.1, 'sine', 0.04, 0.03); },
  resorte: () => { tono(200, 900, 0.28, 'triangle', 0.12); tono(400, 1500, 0.2, 'sine', 0.06, 0.05); },
  choco:   () => { ruido(0.05, 0.12, 4000); tono(880, 1320, 0.12, 'triangle', 0.1); },
  vida:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.14, 'triangle', 0.09, i * 0.07)),
  pisoton: () => { tono(420, 120, 0.12, 'triangle', 0.12); ruido(0.06, 0.1, 1500); },
  patada:  () => { ruido(0.12, 0.2, 900); tono(220, 80, 0.1, 'triangle', 0.13); },
  hielo:   () => { tono(1800, 2600, 0.18, 'triangle', 0.08); tono(2400, 3200, 0.14, 'sine', 0.05, 0.05); },
  rompe:   () => { ruido(0.3, 0.2, 5000); tono(1500, 300, 0.25, 'triangle', 0.08); },
  poder:   () => [523, 659, 784, 1047].forEach((f, i) => tono(f, f, 0.12, 'triangle', 0.09, i * 0.07)),
  escudo:  () => { [392, 523, 659].forEach((f, i) => tono(f, f * 1.5, 0.2, 'triangle', 0.1, i * 0.08)); },
  golpe:   () => { tono(260, 70, 0.3, 'sawtooth', 0.1); ruido(0.1, 0.15, 1200); },
  ouch:    () => voz(personaje.voz),
  pincho:  () => { tono(900, 150, 0.25, 'sawtooth', 0.09); ruido(0.1, 0.12, 3000); },
  tragar:  () => { tono(300, 60, 0.5, 'sawtooth', 0.12); ruido(0.3, 0.12, 400); },
  siseo:   () => ruido(0.25, 0.06, 6000),
  rugido:  () => { tono(140, 50, 0.7, 'sawtooth', 0.14); ruido(0.5, 0.12, 500); },
  lanza:   () => { ruido(0.18, 0.1, 2500); tono(500, 250, 0.15, 'triangle', 0.05); },
  gana:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.2, 'triangle', 0.1, i * 0.12)),
  logro:   () => [659, 784, 988, 1319].forEach((f, i) => { tono(f, f, 0.22, 'triangle', 0.1, i * 0.1); tono(f * 2, f * 2, 0.15, 'sine', 0.04, i * 0.1); }),
  pierde:  () => [400, 350, 300, 200].forEach((f, i) => tono(f, f * 0.8, 0.28, 'triangle', 0.12, i * 0.2)),
  menu:    () => tono(660, 880, 0.08, 'triangle', 0.08),
  clic:    () => tono(500, 700, 0.06, 'triangle', 0.07),
  bloque:  () => tono(160, 100, 0.09, 'triangle', 0.1),
};
const sfx = n => { try { SONIDOS[n](); } catch (e) {} };

// --- Instrumentos de la música (suaves, no "de 8 bits") ---
function enviar(g, rev) {
  g.connect(busMusica);
  if (rev) { const s = audioCtx.createGain(); s.gain.value = rev; g.connect(s); s.connect(convolver); }
}
function marimba(f, t, v, dur) {
  const a = audioCtx, g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[1, 1], [4, 0.28], [9.2, 0.07]].forEach(([m, amp]) => { const o = a.createOscillator(), ga = a.createGain(); o.type = 'sine'; o.frequency.value = f * m; ga.gain.value = amp; o.connect(ga); ga.connect(g); o.start(t); o.stop(t + dur + 0.05); });
  enviar(g, 0.5);
}
function bajoNota(f, t, v, dur) {
  const a = audioCtx, g = a.createGain(), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(260, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [['triangle', f], ['sine', f / 2]].forEach(([tp, fr]) => { const o = a.createOscillator(); o.type = tp; o.frequency.value = fr; o.connect(fl); o.start(t); o.stop(t + dur + 0.05); });
  fl.connect(g); enviar(g, 0.05);
}
function padNota(f, t, dur, v) {
  const a = audioCtx, g = a.createGain(), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 1100;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.4); g.gain.setValueAtTime(v, t + dur - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.3);
  [-6, 6].forEach(d => { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = d; o.connect(fl); o.start(t); o.stop(t + dur + 0.4); });
  fl.connect(g); enviar(g, 0.5);
}
function percusion(tipo, t, v) {
  const a = audioCtx, g = a.createGain();
  if (tipo === 'bombo') { const o = a.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); o.connect(g); o.start(t); o.stop(t + 0.2); }
  else { const s = a.createBufferSource(), f = a.createBiquadFilter(); s.buffer = bufRuido; f.type = tipo === 'caja' ? 'bandpass' : 'highpass'; f.frequency.value = tipo === 'caja' ? 1900 : 7500;
    const d = tipo === 'caja' ? 0.13 : 0.045; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f); f.connect(g); s.start(t, Math.random() * 0.4); s.stop(t + d + 0.02); }
  enviar(g, tipo === 'caja' ? 0.2 : 0);
}
const ACORDES = s => s.split(' ').map(x => [parseInt(x), x.endsWith('m') ? 'm' : 'M']);
const MEL = s => s.replace(/\|/g, ' ').trim().split(/\s+/).map(x => x === '.' ? null : parseInt(x));
const CALLE = {
  bpm: 128, sw: 0.1, root: 392, vel: 1, pad: false, bajo: [0, null, 7, null, 0, null, 7, null], comp: [1, 3, 5, 7], bombo: [0, 4], caja: [2, 6], hat: [1, 3, 5, 7],
  acordes: ACORDES('0M 7M 9m 5M 0M 7M 5M 7M 5M 0M 2m 7M 5M 0M 7M 0M'),
  mel: MEL('7 . 12 . 11 9 7 . | 9 . 14 . 12 11 9 . | 11 . 16 . 14 12 11 . | 12 11 9 7 9 . . . | 7 . 12 . 11 9 7 . | 9 . 14 . 12 11 9 7 | 5 7 9 12 11 9 7 5 | 7 . 11 . 14 . . . | 12 . 9 . 12 . 14 . | 16 . 14 . 12 . 11 . | 9 . 12 . 14 12 9 . | 11 . 14 . 11 9 7 . | 12 . 14 . 16 14 12 . | 14 . 12 . 11 . 9 . | 9 11 14 11 9 7 9 11 | 12 . 7 . 4 . . .'),
};
const PISTAS = {
  calle: CALLE,
  menu: { ...CALLE, bpm: 92, vel: 0.85, pad: true, bajo: [0, null, null, null, 7, null, null, null], comp: [2, 6], bombo: [], caja: [], hat: [] },
  tarde: {
    bpm: 98, sw: 0.14, root: 329.63, vel: 0.95, pad: true, bajo: [0, null, 7, null, 0, null, null, 7], comp: [1, 3, 5, 7], bombo: [0, 4], caja: [6], hat: [3, 7],
    acordes: ACORDES('0m 8M 3M 10M 0m 8M 10M 0m 5m 8M 3M 10M 5m 8M 10M 0m'),
    mel: MEL('7 . 12 . 10 . 7 . | 8 . 12 . 10 8 7 . | 7 . 10 . 14 . 12 10 | 14 . 10 . 12 . 10 7 | 7 . 12 . 15 . 14 12 | 15 . 12 . 8 . 7 . | 10 . 12 . 14 . 12 10 | 12 . 7 . 3 . . . | 12 . 8 . 5 . 8 12 | 15 . 12 . 8 . 12 . | 14 . 10 . 7 . 10 14 | 17 . 14 . 10 . 14 . | 12 . 15 . 17 . 15 12 | 15 . 12 . 8 . 12 15 | 14 . 10 . 14 . 17 . | 12 . 7 . 3 . 7 .'),
  },
  jefe: {
    bpm: 150, sw: 0, root: 440, vel: 1.05, pad: false, bajo: [0, 0, null, 0, 0, null, 0, 0], comp: [1, 3, 5, 7], bombo: [0, 2, 4, 6], caja: [2, 6], hat: [0, 1, 2, 3, 4, 5, 6, 7],
    acordes: ACORDES('0m 8M 10M 7M 0m 8M 10M 7M'),
    mel: MEL('12 12 . 15 12 . 10 . | 12 12 . 15 12 . 8 . | 14 14 . 17 14 . 10 . | 14 14 . 16 14 . 11 . | 15 . 12 . 15 . 17 . | 17 . 15 . 12 . 8 . | 14 . 17 . 19 . 17 14 | 16 . 14 . 11 . 14 16'),
  },
};
let nombreMusica = null, pistaAct = null, pasoM = 0, proxT = 0;
function musica(nombre) { if (nombre === nombreMusica) return; nombreMusica = nombre; pistaAct = nombre ? PISTAS[nombre] : null; pasoM = 0; proxT = 0; }
function paso(p, m, t) {
  const bar = Math.floor(m / 8) % p.acordes.length, s = m % 8, [raiz, tipo] = p.acordes[bar], f = st => Math.pow(2, st / 12);
  const ct = tipo === 'm' ? [0, 3, 7] : [0, 4, 7], v = p.vel;
  const n = p.mel[(bar * 8 + s) % p.mel.length];
  if (n !== null) marimba(p.root * f(n), t, 0.2 * v, 0.55);
  const b = p.bajo[s]; if (b !== null && b !== undefined) bajoNota(p.root / 4 * f(raiz + b), t, 0.3 * v, 0.34);
  if (p.comp.includes(s)) ct.forEach((c, i) => marimba(p.root / 2 * f(raiz + c + (i === 0 ? 12 : 0)), t + i * 0.012, 0.045 * v, 0.28));
  if (p.pad && s === 0) ct.forEach(c => padNota(p.root / 2 * f(raiz + c), t, 60 / p.bpm * 4, 0.028 * v));
  if (p.bombo.includes(s)) percusion('bombo', t, 0.5 * v);
  if (p.caja.includes(s)) percusion('caja', t, 0.18 * v);
  if (p.hat.includes(s)) percusion('hat', t, 0.045 * v);
}
setInterval(() => {
  const a = audioCtx; if (!a || !pistaAct || silencio) { proxT = 0; return; }
  if (proxT === 0 || proxT < a.currentTime - 0.3) proxT = a.currentTime + 0.08;
  while (proxT < a.currentTime + 0.3) {
    try { paso(pistaAct, pasoM, proxT); } catch (e) {}
    const base = 60 / pistaAct.bpm / 2; proxT += base * (pasoM % 2 ? 1 - pistaAct.sw : 1 + pistaAct.sw); pasoM++;
  }
}, 60);

// ---------- 3. CONTROLES ----------
// Teclado: flechas o A/D mover | Espacio, W o ↑ saltar | Z o K patear | X o J poder | P o Esc pausa | M sonido
// Control (Switch, Xbox, PS): palanca/cruceta mover | A o B saltar | Y patear | X poder | + pausa
// Pantalla táctil: los 5 botones de la pantalla.
const teclas = {}, pulsos = {}, tactil = {};
let tactilActivo = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pulsos[e.code] = true;
  teclas[e.code] = true;
  audio();
  if (e.code === 'KeyM' && !e.repeat) { silencio = !silencio; aplicarVolumen(); }
});
addEventListener('keyup', e => teclas[e.code] = false);
const pulso = (...cods) => cods.reduce((hay, c) => { const v = pulsos[c]; pulsos[c] = false; return hay || !!v; }, false);

const pad = { held: {}, edge: {}, prev: {} };
function actualizarPad() {
  pad.held = {}; pad.edge = {};
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    p.buttons.forEach((b, i) => { if (b.pressed) pad.held[i] = true; });
    if (p.axes[0] < -0.5) pad.held[100] = true;
    if (p.axes[0] >  0.5) pad.held[101] = true;
    if (p.axes[1] < -0.5) pad.held[102] = true;
    if (p.axes[1] >  0.5) pad.held[103] = true;
  }
  for (const k in pad.held) if (!pad.prev[k]) pad.edge[k] = true;
  pad.prev = pad.held;
}

// Botones táctiles: cada botón registra su dedo con "pointer events" (se pueden apretar varios a la vez)
const BOTONES = { 'b-izq': 'izq', 'b-der': 'der', 'b-salto': 'salto', 'b-patada': 'patada', 'b-poder': 'poder' };
Object.entries(BOTONES).forEach(([id, nombre]) => {
  const el = document.getElementById(id);
  const soltar = () => { tactil[nombre] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); tactilActivo = true; audio();
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    tactil[nombre] = true; el.classList.add('on');
    if (nombre === 'patada') pulsos.TactilPatada = true;
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, soltar));
  el.addEventListener('contextmenu', e => e.preventDefault());
});
document.addEventListener('contextmenu', e => { if (tactilActivo) e.preventDefault(); });
const botonesVisibles = () => aj.botones === 'siempre' || (aj.botones === 'auto' && tactilActivo);

function leerControles() {
  const h = pad.held, e = pad.edge;
  return {
    izq: teclas.ArrowLeft || teclas.KeyA || h[14] || h[100] || tactil.izq,
    der: teclas.ArrowRight || teclas.KeyD || h[15] || h[101] || tactil.der,
    salto: teclas.Space || teclas.ArrowUp || teclas.KeyW || h[0] || h[1] || tactil.salto,
    patada: pulso('KeyZ', 'KeyK', 'TactilPatada') || e[2],
    poder: pulso('KeyX', 'KeyJ') || e[3] || e[5] || e[7] || tactil.poder,
  };
}

// ---------- 4. DIBUJOS ----------
function crearCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function azar(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
function grad(g, x0, y0, x1, y1, paradas) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  paradas.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
function trazoRedondo(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const hex2rgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const sombrear = (hex, f) => { const [r, g, b] = hex2rgb(hex); const c = v => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const aclarar  = (hex, f) => { const [r, g, b] = hex2rgb(hex); const c = v => Math.round(v + (255 - v) * f); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const CONTORNO = '#3a2418';

// --- Personajes: niños y animalitos (dibujados con curvas y contorno de caricatura) ---
function capsula(g, x0, y0, x1, y1, ancho, color) {
  g.lineCap = 'round';
  g.strokeStyle = CONTORNO; g.lineWidth = ancho + 2.6; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
  g.strokeStyle = color; g.lineWidth = ancho; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
}
function miembro(g, hx, hy, ang, largo, ancho, color) {     // (lo usan los jefes)
  const ex = hx + Math.sin(ang) * largo, ey = hy + Math.cos(ang) * largo;
  capsula(g, hx, hy, ex, ey, ancho, color);
  return [ex, ey];
}
function mano(g, [x, y], piel) {
  g.fillStyle = piel; g.strokeStyle = CONTORNO; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, 3.3, 0, 7); g.fill(); g.stroke();
}
function brazo(g, pj, hx, hy, ang, manga, pelaje) {
  const L = 11.5, ex = hx + Math.sin(ang) * L, ey = hy + Math.cos(ang) * L;
  capsula(g, hx, hy, ex, ey, 5.2, pelaje || pj.piel);
  capsula(g, hx, hy, hx + Math.sin(ang) * 4.4, hy + Math.cos(ang) * 4.4, 6.6, manga);
  if (pj.tipo !== 'toh') mano(g, [ex, ey], pelaje || pj.piel);
  else { g.fillStyle = '#1f7a62'; g.strokeStyle = CONTORNO; g.lineWidth = 1.2; g.beginPath(); g.ellipse(ex, ey, 3.6, 4.6, ang * -1, 0, 7); g.fill(); g.stroke(); }
}
function zapato(g, fx, fy, color, botas) {
  if (botas) {                                              // resorte debajo de la bota
    g.strokeStyle = '#6b7080'; g.lineWidth = 2.2; g.beginPath(); g.moveTo(fx - 1, fy - 5);
    for (let i = 0; i < 5; i++) g.lineTo(i % 2 ? fx - 2 : fx + 6, fy - 4.2 + i * 1);
    g.stroke(); g.strokeStyle = '#c9ceda'; g.lineWidth = 1; g.stroke(); fy -= 5;
  }
  g.fillStyle = botas ? '#ff8a1f' : color; g.strokeStyle = CONTORNO; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(fx - 4.6, fy - 0.2); g.quadraticCurveTo(fx - 5.6, fy - 6.5, fx - 1, fy - 7); g.lineTo(fx + 2.6, fy - 6.4); g.quadraticCurveTo(fx + 9.8, fy - 6, fx + 9.6, fy - 1.6); g.quadraticCurveTo(fx + 9.4, fy + 0.4, fx + 7, fy + 0.4); g.lineTo(fx - 3.8, fy + 0.4); g.quadraticCurveTo(fx - 4.7, fy + 0.4, fx - 4.6, fy - 0.2); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(fx - 4.4, fy - 1.4, 13.4, 1.8);          // suela
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(fx + 5, fy - 4.6, 2.6, 1.2, 0, 0, 7); g.fill();
}
function pierna(g, pj, hx, hy, fx, fy, botas) {
  const lift = botas ? 5 : 0, ay = fy - lift - 2;
  const pelaje = pj.tipo === 'toh' ? '#f0b020' : pj.piel;
  capsula(g, hx, hy, fx + 1, ay, pj.tipo === 'toh' ? 3.6 : 5.6, pelaje);
  if (pj.estilo !== 'sofi' && pj.tipo !== 'toh') capsula(g, hx, hy, hx + (fx + 1 - hx) * 0.5, hy + (ay - hy) * 0.5 + 1, 7.4, pj.pantalon);
  zapato(g, fx, fy, pj.zapato, botas);
}
function torso(g, pj) {
  const cG = grad(g, -10, 0, 11, 0, [[0, aclarar(pj.camisa[0].replace(/^rgb.*/, '#888'), 0)], [0, pj.camisa[0]], [0.65, pj.camisa[1]], [1, sombrear(pj.camisa[1], 0.78)]]);
  g.fillStyle = cG; g.strokeStyle = CONTORNO; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(-9.6, -33); g.quadraticCurveTo(-10.6, -35.6, -7, -35.6); g.lineTo(7, -35.6); g.quadraticCurveTo(10.6, -35.6, 9.6, -33); g.lineTo(11, -15); g.quadraticCurveTo(11, -12.6, 8.6, -12.6); g.lineTo(-8.6, -12.6); g.quadraticCurveTo(-11, -12.6, -11, -15); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.moveTo(-8, -33); g.lineTo(-4, -33); g.lineTo(-5, -15); g.lineTo(-9, -15); g.closePath(); g.fill();
  g.fillStyle = pj.tipo === 'toh' ? '#f6d9a0' : pj.piel; g.beginPath(); g.moveTo(-4, -35.6); g.quadraticCurveTo(0, -29.6, 4, -35.6); g.fill();   // cuello
  g.strokeStyle = CONTORNO; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-4, -35.4); g.quadraticCurveTo(0, -29.8, 4, -35.4); g.stroke();
  if (pj.tipo === 'toh') { g.fillStyle = '#f6d9a0'; g.beginPath(); g.ellipse(1, -24, 6.5, 9, 0, 0, 7); g.fill(); return; }
  g.fillStyle = '#fff';
  if (pj.estilo === 'sofi') { g.beginPath(); g.arc(-2, -26, 2.5, 0, 7); g.arc(2, -26, 2.5, 0, 7); g.fill(); g.beginPath(); g.moveTo(-4.4, -25.4); g.lineTo(4.4, -25.4); g.lineTo(0, -20.2); g.fill(); }
  else if (pj.estilo === 'julian') { g.fillStyle = 'rgba(180,110,0,.4)'; g.fillRect(-10, -28, 20, 2.6); g.fillRect(-10, -22.5, 20, 2.6); }
  else if (pj.estilo === 'lichi') { g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 1.9 : 4, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * r, -25 + Math.sin(a) * r); } g.fill(); }
  else { g.beginPath(); g.arc(0, -25, 3.6, 0, 7); g.fill(); g.fillStyle = pj.camisa[1]; g.beginPath(); g.arc(0, -25, 1.8, 0, 7); g.fill(); }
}
function cadera(g, pj) {                                    // pantaloncito o falda
  g.fillStyle = pj.pantalon; g.strokeStyle = CONTORNO; g.lineWidth = 1.6;
  if (pj.estilo === 'sofi') {
    g.beginPath(); g.moveTo(-9, -19.5); g.lineTo(9, -19.5); g.lineTo(14.5, -9.5); for (let i = 0; i < 4; i++) g.quadraticCurveTo(10.8 - i * 7.2, -6.2, 7.2 - i * 7.2, -9.5); g.lineTo(-14.5, -9.5); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.25)'; g.beginPath(); g.moveTo(-7, -18.5); g.lineTo(-3, -18.5); g.lineTo(-7, -10); g.lineTo(-11, -10); g.fill();
  } else {
    trazoRedondo(g, -10, -20, 20, 9.5, 3.4); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -19); g.lineTo(0, -12); g.stroke();
  }
}

// Cabezas
function ojos(g, pj, cy, t, dx = 0, esc = 1) {
  const parp = (t % 240) < 7;
  [1.8 + dx, 8.6 + dx].forEach(ex => {
    g.fillStyle = '#fff'; g.strokeStyle = CONTORNO; g.lineWidth = 1.1;
    g.beginPath(); g.ellipse(ex, cy + 1.6, 3.3 * esc, parp ? 0.8 : 4.3 * esc, 0, 0, 7); g.fill(); g.stroke();
    if (!parp) {
      g.fillStyle = pj.ojos; g.beginPath(); g.ellipse(ex + 0.9, cy + 2.2, 2.6 * esc, 3.5 * esc, 0, 0, 7); g.fill();
      g.fillStyle = '#12121c'; g.beginPath(); g.ellipse(ex + 1.1, cy + 2.4, 1.4 * esc, 2 * esc, 0, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 0.1, cy + 0.7, 1.15, 0, 7); g.fill(); g.beginPath(); g.arc(ex + 2.1, cy + 3.8, 0.6, 0, 7); g.fill();
    }
  });
}
function boca(g, cy, abierta, x = 6.6, y = 7.6) {
  g.strokeStyle = CONTORNO; g.lineWidth = 1.4;
  if (abierta) { g.fillStyle = '#7a2230'; g.beginPath(); g.ellipse(x, cy + y + 0.6, 3, 2.7, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#ff7b88'; g.beginPath(); g.ellipse(x, cy + y + 1.8, 1.8, 1.1, 0, 0, 7); g.fill(); }
  else { g.beginPath(); g.arc(x, cy + y - 1.8, 3.3, 0.18 * Math.PI, 0.82 * Math.PI); g.stroke(); }
}
function cabezaNino(g, pj, cy, t, abierta) {
  const pg = grad(g, 0, cy - 16, 0, cy + 14, [[0, pj.pelo[0]], [1, pj.pelo[1]]]), borde = pj.estilo === 'sofi' ? '#b8901c' : '#5a3a14';
  g.fillStyle = pg; g.strokeStyle = borde; g.lineWidth = 1.6;
  if (pj.estilo === 'sofi') {                               // rizos de atrás
    for (let i = 0; i < 12; i++) { const a = Math.PI * 0.85 + i * (Math.PI * 1.3 / 11); g.beginPath(); g.arc(Math.cos(a) * 12.8, cy + Math.sin(a) * 12.8 - 1, 5.6, 0, 7); g.fill(); g.stroke(); }
    [[-14.5, cy + 3], [-15, cy + 10], [-12.5, cy + 16.5], [14, cy + 3], [14.6, cy + 10], [12.2, cy + 16.5]].forEach(([cx, ccy]) => { g.beginPath(); g.arc(cx, ccy, 5, 0, 7); g.fill(); g.stroke(); });
  } else { g.beginPath(); g.ellipse(-4, cy + 2, 12, 13, 0, 0, 7); g.fill(); g.stroke(); }
  g.fillStyle = grad(g, -11, cy - 13, 11, cy + 13, [[0, pj.piel], [1, '#f2b88e']]); g.strokeStyle = CONTORNO; g.lineWidth = 1.7;
  g.beginPath(); g.arc(0, cy, 13.2, 0, 7); g.fill(); g.stroke();
  g.fillStyle = pj.piel; g.beginPath(); g.arc(-12.3, cy + 2.5, 3.1, 0, 7); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,100,110,.4)'; g.beginPath(); g.ellipse(3.4, cy + 7.2, 3, 2, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(11.2, cy + 7.2, 2.4, 1.8, 0, 0, 7); g.fill();
  ojos(g, pj, cy, t); boca(g, cy, abierta);
  g.fillStyle = '#e8a77c'; g.beginPath(); g.ellipse(12.6, cy + 4.4, 1.6, 1.3, 0, 0, 7); g.fill();
  g.strokeStyle = pj.pelo[1]; g.lineWidth = 2; g.lineCap = 'round';                                          // cejas
  g.beginPath(); g.moveTo(0.4, cy - 5.6); g.quadraticCurveTo(2.8, cy - 7.4, 5.4, cy - 6); g.moveTo(7.4, cy - 6); g.quadraticCurveTo(10, cy - 7.4, 12, cy - 5.4); g.stroke();
  g.fillStyle = pg; g.strokeStyle = borde; g.lineWidth = 1.6;
  if (pj.estilo === 'sofi') {                               // flequillo de rizos y moño rosa
    [[10.5, cy - 8.5], [5.5, cy - 12], [-0.5, cy - 13], [-6.5, cy - 11], [-11.5, cy - 6]].forEach(([cx, ccy]) => { g.beginPath(); g.arc(cx, ccy, 4.8, 0, 7); g.fill(); g.stroke(); });
    g.fillStyle = '#ff4f9a'; g.strokeStyle = '#a02a68'; g.lineWidth = 1.4;
    [-1, 1].forEach(s => { g.beginPath(); g.ellipse(-4 + s * 6, cy - 17.5, 6, 3.8, s * -0.45, 0, 7); g.fill(); g.stroke(); });
    g.beginPath(); g.arc(-4, cy - 17.5, 2.6, 0, 7); g.fill(); g.stroke();
  } else if (pj.estilo === 'julian') {                      // despeinado con picos
    [[-9, cy - 9, -6, cy - 20, -1.5, cy - 12], [-3, cy - 12, 2, cy - 22, 6.5, cy - 11], [5, cy - 11, 11, cy - 17, 12.5, cy - 6]].forEach(([a, b, c, d, e, f]) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.closePath(); g.fill(); g.stroke(); });
    g.beginPath(); g.arc(0, cy - 0.5, 13.8, Math.PI * 0.97, Math.PI * 2.03);
    [[13.4, cy - 3], [10.4, cy - 7], [7, cy - 3.6], [3.4, cy - 8.2], [-0.4, cy - 4], [-4.6, cy - 8], [-8.6, cy - 4], [-13.6, cy - 5]].forEach(([px, py]) => g.lineTo(px, py)); g.closePath(); g.fill(); g.stroke();
  } else {                                                  // güero con mechón
    g.beginPath(); g.moveTo(-3, cy - 12); g.quadraticCurveTo(-1, cy - 22, 6, cy - 18); g.quadraticCurveTo(2.5, cy - 15, 3.5, cy - 11); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, cy - 0.5, 13.8, Math.PI * 0.97, Math.PI * 2.03); g.lineTo(13.4, cy - 4);
    g.bezierCurveTo(10, cy - 5.5, 6, cy - 11, -0.5, cy - 8.4); g.bezierCurveTo(-5, cy - 6.5, -8.5, cy - 9, -13.6, cy - 3.6); g.closePath(); g.fill(); g.stroke();
  }
  if (pj.estilo !== 'sofi') { g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.7; g.beginPath(); g.arc(-1, cy - 2.5, 10.5, Math.PI * 1.12, Math.PI * 1.55); g.stroke(); }
}
function cabezaPerro(g, pj, cy, t, abierta) {
  const oreja = (x, y, rot) => { g.fillStyle = grad(g, x, y - 10, x, y + 10, [[0, pj.pelo[0]], [1, pj.pelo[1]]]); g.strokeStyle = CONTORNO; g.lineWidth = 1.6; g.beginPath(); g.ellipse(x, y, 5.4, 10.6, rot, 0, 7); g.fill(); g.stroke(); };
  oreja(-11, cy - 1, 0.3);
  g.fillStyle = grad(g, -11, cy - 13, 11, cy + 13, [[0, aclarar(pj.piel, 0.15)], [1, pj.piel]]); g.strokeStyle = CONTORNO; g.lineWidth = 1.7;
  g.beginPath(); g.arc(0, cy, 13.2, 0, 7); g.fill(); g.stroke();
  g.fillStyle = pj.pelo[0]; g.beginPath(); g.ellipse(9, cy - 0.5, 5, 6.2, 0, 0, 7); g.fill();            // mancha en el ojo
  g.fillStyle = '#f2d6ae'; g.strokeStyle = CONTORNO; g.lineWidth = 1.5; g.beginPath(); g.ellipse(9.4, cy + 6.4, 8, 5.6, 0, 0, 7); g.fill(); g.stroke();   // hocico
  ojos(g, pj, cy - 1, t, -0.4, 0.92);
  g.fillStyle = '#1a1010'; g.beginPath(); g.ellipse(15.8, cy + 3.8, 3.3, 2.6, 0, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.7)'; g.beginPath(); g.ellipse(14.8, cy + 2.9, 1.1, .7, 0, 0, 7); g.fill();
  g.strokeStyle = CONTORNO; g.lineWidth = 1.4; g.beginPath(); g.moveTo(15.2, cy + 6.2); g.lineTo(15.2, cy + 8); g.stroke();
  if (abierta) { g.fillStyle = '#7a2230'; g.beginPath(); g.ellipse(11.8, cy + 9.6, 4.4, 3.2, 0, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#ff6f86'; g.beginPath(); g.ellipse(12.2, cy + 13, 2.8, 3.6, 0, 0, 7); g.fill(); g.stroke(); }
  else { g.beginPath(); g.arc(11.2, cy + 6.4, 3.4, 0.2 * Math.PI, 0.85 * Math.PI); g.stroke(); }
  oreja(-3, cy - 7, 0.55);
}
function cabezaVenado(g, pj, cy, t, abierta) {
  g.strokeStyle = '#6b4220'; g.lineCap = 'round';                                                       // astas
  [[-4, -1], [5, 1]].forEach(([bx, s]) => { g.lineWidth = 4.4; g.strokeStyle = CONTORNO; g.beginPath(); g.moveTo(bx, cy - 11); g.quadraticCurveTo(bx + s * 2, cy - 19, bx + s * 6, cy - 26); g.moveTo(bx + s * 2, cy - 18); g.lineTo(bx + s * 8, cy - 17); g.stroke();
    g.lineWidth = 2.4; g.strokeStyle = '#a8763c'; g.beginPath(); g.moveTo(bx, cy - 11); g.quadraticCurveTo(bx + s * 2, cy - 19, bx + s * 6, cy - 26); g.moveTo(bx + s * 2, cy - 18); g.lineTo(bx + s * 8, cy - 17); g.stroke(); });
  const oreja = (x, y, rot) => { g.fillStyle = pj.piel; g.strokeStyle = CONTORNO; g.lineWidth = 1.6; g.beginPath(); g.ellipse(x, y, 3.8, 8, rot, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#f7b7b0'; g.beginPath(); g.ellipse(x, y, 1.9, 5, rot, 0, 7); g.fill(); };
  oreja(-11.5, cy - 6, -0.9); oreja(9.5, cy - 11, 0.8);
  g.fillStyle = grad(g, -11, cy - 13, 11, cy + 13, [[0, aclarar(pj.piel, 0.18)], [1, pj.piel]]); g.strokeStyle = CONTORNO; g.lineWidth = 1.7;
  g.beginPath(); g.arc(0, cy, 13.2, 0, 7); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.85)'; [[-4, cy - 8, 1.6], [0, cy - 10, 1.3], [-8, cy - 4, 1.2]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); });

    moverConColision(e);
    if (e.chocoPared && e.congelado === 0) { e.dirP = -e.dirP; e.x = antes; }
    if (patear(e, () => matar(e, e.congelado > 0, '#9b59d6'))) continue;

  for (const k in rebote) if (--rebote[k] <= 0) delete rebote[k];

}

function menuControl() {
  const e = pad.edge, ok = () => pulso('Enter', 'Space') || e[0] || e[1];

    if (pulso('ArrowLeft', 'KeyA') || e[14] || e[100]) { seleccion = (seleccion + PERSONAJES.length - 1) % PERSONAJES.length; if (desbloqueado(PERSONAJES[seleccion])) personaje = PERSONAJES[seleccion]; sfx('menu'); }
    if (pulso('ArrowRight', 'KeyD') || e[15] || e[101]) { seleccion = (seleccion + 1) % PERSONAJES.length; if (desbloqueado(PERSONAJES[seleccion])) personaje = PERSONAJES[seleccion]; sfx('menu'); }
    if (modoPers === 'elegir' && ok() && desbloqueado(PERSONAJES[seleccion])) { sfx('menu'); nuevaPartidaDesdeMenu(); }
    if (pulso('Escape', 'Backspace') || e[8]) irA('menu');
    return;
  }
  if (estado === 'intro') {
    if (ok()) { const total = HISTORIA.join('').length; if (estadoT * VEL_TEXTO() < total) estadoT = 99999; else { sfx('menu'); nuevoJuego(); } }
    if (pulso('Escape')) irA('menu');
    return;
  }
  if ((estado === 'perdio' || estado === 'gano' || estado === 'nivelok') && estadoT <= 45) return;
  // menús con botones, sliders y botones de cambio
  const n = ui.rects.filter(r => !r.sinFoco).length, lista = ui.rects.filter(r => !r.sinFoco);
  if (!n) return;
  if (ui.foco >= n) ui.foco = n - 1;
  if (pulso('ArrowDown', 'KeyS') || e[13] || e[103]) { ui.foco = (ui.foco + 1) % n; sfx('clic'); }
  if (pulso('ArrowUp', 'KeyW') || e[12] || e[102]) { ui.foco = (ui.foco + n - 1) % n; sfx('clic'); }
  const r = lista[ui.foco];

  if (r.tipo === 'slider') { if (izq) { r.set(pasoUI(r.get() - r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } if (der) { r.set(pasoUI(r.get() + r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } }
  else if (r.tipo === 'toggle') { if (izq || der || ok()) { r.accion(); sfx('clic'); } }

}
function puntoLogico(ev) { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height }; }

  if (i < 0) { if (estado === 'intro' && estadoT > 20) { const total = HISTORIA.join('').length; if (estadoT * VEL_TEXTO() < total) estadoT = 99999; else nuevoJuego(); } return; }
  const r = ui.rects[i], lista = ui.rects.filter(q => !q.sinFoco), k = lista.indexOf(r); if (k >= 0) ui.foco = k;

  else { sfx('clic'); r.accion(); }
});
canvas.addEventListener('pointermove', ev => {
  const { x, y } = puntoLogico(ev);
  if (ui.arr) { fijarSlider(ui.arr, x); return; }
  if (estado === 'jugando') return;
  const lista = ui.rects.filter(q => !q.sinFoco), k = lista.findIndex(r => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h); if (k >= 0) ui.foco = k;
});
['pointerup', 'pointercancel'].forEach(t => canvas.addEventListener(t, () => { if (ui.arr && ui.arr.suelta) ui.arr.suelta(); ui.arr = null; }));
addEventListener('pointerup', () => { ui.arr = null; });
