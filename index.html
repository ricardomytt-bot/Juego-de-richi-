<script>
// ============================================================
//  LICHILÓN Y EL PATRÓN  -  Versión 0.9
//  Historia: el Patrón y la Patrona subieron la renta de los departamentos.
//  Los tres hermanos tienen que derrotarlos para ganar su depa gratis.
//
//  Partes del código:
//   1. Personajes   2. Sonidos   3. Controles   4. Dibujos (niños, enemigos, jefes)
//   5. Escenario de Mérida   6. Niveles   7. Reglas del juego   8. Pantallas   9. Ciclo
// ============================================================

const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;                           // tamaño "lógico" del juego
const ESC = canvas.width / W;                     // el dibujo real es más grande para verse nítido

const GRAVEDAD = 0.6;
const VIDAS_INICIO = 3, VIDAS_MAX = 5, CHOCOS_POR_VIDA = 3;
const BOTAS_DURACION = 900;                       // 15 segundos

// ---------- 1. PERSONAJES (cambia estos números para inventar ventajas) ----------
// Los tres primeros están desde el inicio. Los otros tres son personajes secretos: por ahora solo aparecen bloqueados.
const PERSONAJES = [
  { id: 'lichi', nombre: 'LICHILÓN', estilo: 'lichi', vel: 3.4, salto: 13.6, caida: 1.0, maxCaida: 15, voz: 215,

  { id: 'julian', nombre: 'JULIÁN CHÓN', estilo: 'julian', vel: 4.1, salto: 12.2, caida: 1.0, maxCaida: 15, voz: 190,

    piel: '#f3cfa4', piel2: '#d6a676', pelo: ['#9a6035', '#64391c'], camisa: ['#e6b52e', '#b98618'], pantalon: '#2b3e72', zapato: '#8f3a2c', mejilla: '#d8403a', mod: { piel: '#f4c79a', pelo: '#7a4a2a', cejas: '#5a3218', camisa: '#ffd93b', detalle: '#e0a800', pantalon: '#2f5aa8', zapato: '#e0483a', iris: '#8a5a24' } },
  { id: 'sofi', nombre: 'SOFI LOFI', estilo: 'sofi', vel: 3.7, salto: 13.2, caida: 0.7, maxCaida: 7.5, voz: 330,
    desc: ['Cae más suave', 'que los demás.'], stats: { vel: 3, salto: 3, caida: 4 },
    piel: '#fbe3c4', piel2: '#dcb48e', pelo: ['#f4dc62', '#cfa52b'], camisa: ['#df6f9e', '#b24a78'], pantalon: '#6f56b0', zapato: '#7a4a2c', mejilla: '#d8403a', mod: { piel: '#ffd7b3', pelo: '#f9df55', cejas: '#d0a21a', camisa: '#ff82b4', detalle: '#ffffff', pantalon: '#8e63d8', zapato: '#b04bd6', iris: '#2fa36b' } },
  { id: 'sec1', nombre: '???', pendiente: true, logro: 'patron',     pista: 'Derrota al Patrón' },
  { id: 'sec2', nombre: '???', pendiente: true, logro: 'choco30',    pista: 'Recoge 30 Kit Kats' },
  { id: 'sec3', nombre: '???', pendiente: true, logro: 'serpientes', pista: 'Derrota 8 serpientes' },
];

// ---------- AJUSTES Y DATOS GUARDADOS ----------
const CLAVE_GUARDADO = 'lichilon_departamentos_v1';
const ES_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const AJ_DEFECTO = { musica: 0.6, efectos: 0.8, texto: 1, temblor: true, botones: 'auto', compatible: ES_IOS, pelicula: true, estilo: 'moderno' };
const datos = { ajustes: { ...AJ_DEFECTO }, logros: {}, stats: {}, mejor: 0 };
try {
  const j = JSON.parse(localStorage.getItem(CLAVE_GUARDADO) || 'null');
  if (j) { Object.assign(datos.ajustes, j.ajustes || {}); datos.logros = j.logros || {}; datos.stats = j.stats || {}; datos.mejor = j.mejor || 0; }
} catch (e) {}
function guardarDatos() { try { localStorage.setItem(CLAVE_GUARDADO, JSON.stringify(datos)); return true; } catch (e) { return false; } }
let aj = { ...datos.ajustes };                              // ajustes en uso (se pueden mover sin guardar)
function guardarAjustes() { datos.ajustes = { ...aj }; return guardarDatos(); }
function descartarAjustes() { aj = { ...datos.ajustes }; aplicarVolumen(); }

// ---------- 2. SONIDOS Y MÚSICA (todo se fabrica con código, no hay archivos) ----------
// Hay dos formas de reproducirlo, por si un dispositivo bloquea una de ellas:
//  - Normal: Web Audio (instrumentos en vivo).
//  - Compatible: se crean archivos de audio (.wav) con código y se tocan con <audio>. Se activa solo si el sonido normal no arranca,
//    o a mano en Ajustes > "Sonido compatible".
let audioCtx = null, silencio = false, master = null, busSfx = null, busMusica = null, convolver = null, bufRuido = null;
const SR = 22050;                                           // calidad de los archivos del modo compatible
let grabando = null, respaldoAuto = false, audioMusicaEl = null, silencioEl = null, cacheSfx = {}, cacheMusica = {}, musicaAltPend = null, intentosAudio = 0, silencioURL = null;
const usarAlt = () => aj.compatible || respaldoAuto || !(window.AudioContext || window.webkitAudioContext);

function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); crearBuses(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function crearBuses() {
  const a = audioCtx; master = a.createGain();
  const comp = a.createDynamicsCompressor(); master.connect(comp); comp.connect(a.destination);
  busSfx = a.createGain(); busSfx.connect(master); busMusica = a.createGain(); busMusica.connect(master);
  convolver = a.createConvolver();
  const n = Math.floor(a.sampleRate * 1.7), buf = a.createBuffer(2, n, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
  convolver.buffer = buf; const rev = a.createGain(); rev.gain.value = 0.35; convolver.connect(rev); rev.connect(master);
  const rb = a.createBuffer(1, a.sampleRate, a.sampleRate), rd = rb.getChannelData(0); for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1; bufRuido = rb;
  aplicarVolumen();
}
function aplicarVolumen() {
  if (audioCtx && master) { master.gain.value = silencio ? 0 : 1.8; busSfx.gain.value = aj.efectos; busMusica.gain.value = aj.musica; }
  if (audioMusicaEl) audioMusicaEl.volume = silencio ? 0 : Math.min(1, aj.musica);
}
// Desbloquea el audio con cualquier toque o tecla (los navegadores, sobre todo en celular, lo exigen)
function desbloquearAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const a = audio();
  if (a) { try { const b = a.createBuffer(1, 1, 22050), s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0); } catch (e) {} }
  try {                                                      // truco para que el iPhone/iPad no lo silencie con el switch de timbre
    if (!silencioEl) { silencioURL = silencioURL || wavUrl(new Float32Array(2205)); silencioEl = new Audio(silencioURL); silencioEl.loop = true; silencioEl.volume = 0.02; }
    silencioEl.play().catch(() => {});
  } catch (e) {}
  if (musicaAltPend) musicaAltPend();
  intentosAudio++;
  setTimeout(() => { if ((!audioCtx || audioCtx.state !== 'running') && !respaldoAuto && intentosAudio >= 2) { respaldoAuto = true; reiniciarMusica(); } }, 900);
}
['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => addEventListener(ev, desbloquearAudio, { passive: true }));
function estadoSonido() {
  if (silencio) return 'mute';
  if (usarAlt()) return 'alt';
  return audioCtx && audioCtx.state === 'running' ? 'ok' : 'toca';
}

// --- Notas, ruidos y la voz del "¡ouch!". Si se está "grabando", solo se anotan para fabricar el archivo .wav ---
function tono(f1, f2, dur, tipo = 'square', vol = 0.08, retraso = 0) {
  if (grabando) { grabando.push({ k: 't', f1, f2, dur, tipo, vol, ret: retraso }); return; }
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + retraso, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(busSfx); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ruido(dur, vol = 0.1, filtro = 1200, tipoFiltro = 'lowpass', retraso = 0) {
  if (grabando) { grabando.push({ k: 'r', dur, vol, fil: filtro, tf: tipoFiltro, ret: retraso }); return; }
  const a = audio(); if (!a) return;
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t0 = a.currentTime + retraso;
  f.type = tipoFiltro; f.frequency.value = filtro; s.buffer = bufRuido;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(busSfx); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}
// Voz de "¡ouch!": una vocal que se desliza de "o" a "u" y termina con un "ch"
function voz(grave) {
  if (grabando) { grabando.push({ k: 'v', grave }); return; }
  const a = audio(); if (!a) return;
  const t = a.currentTime, dur = 0.42, o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(grave * 1.5, t); o.frequency.exponentialRampToValueAtTime(grave * 0.85, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[780, 430, 1], [1220, 780, 0.55]].forEach(([f0, f1, amp]) => {
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 7; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const ga = a.createGain(); ga.gain.value = amp; o.connect(f); f.connect(ga); ga.connect(g);
  });
  g.connect(busSfx); o.start(t); o.stop(t + dur + 0.03);
  ruido(0.09, 0.22, 3500, 'highpass', dur - 0.06);
}
const SONIDOS = {
  salto:   () => { tono(300, 760, 0.17, 'triangle', 0.1); tono(600, 1200, 0.1, 'sine', 0.04, 0.03); },
  resorte: () => { tono(200, 900, 0.28, 'triangle', 0.12); tono(400, 1500, 0.2, 'sine', 0.06, 0.05); },
  choco:   () => { ruido(0.05, 0.12, 4000); tono(880, 1320, 0.12, 'triangle', 0.1); },
  vida:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.14, 'triangle', 0.09, i * 0.07)),
  pisoton: () => { tono(420, 120, 0.12, 'triangle', 0.12); ruido(0.06, 0.1, 1500); },
  patada:  () => { ruido(0.12, 0.2, 900); tono(220, 80, 0.1, 'triangle', 0.13); },
  hielo:   () => { tono(1800, 2600, 0.18, 'triangle', 0.08); tono(2400, 3200, 0.14, 'sine', 0.05, 0.05); },
  rompe:   () => { ruido(0.3, 0.2, 5000); tono(1500, 300, 0.25, 'triangle', 0.08); },
  poder:   () => [523, 659, 784, 1047].forEach((f, i) => tono(f, f, 0.12, 'triangle', 0.09, i * 0.07)),
  escudo:  () => { [392, 523, 659].forEach((f, i) => tono(f, f * 1.5, 0.2, 'triangle', 0.1, i * 0.08)); },
  golpe:   () => { tono(260, 70, 0.3, 'sawtooth', 0.1); ruido(0.1, 0.15, 1200); },
  ouch:    () => voz(personaje.voz),
  pincho:  () => { tono(900, 150, 0.25, 'sawtooth', 0.09); ruido(0.1, 0.12, 3000); },
  tragar:  () => { tono(300, 60, 0.5, 'sawtooth', 0.12); ruido(0.3, 0.12, 400); },
  siseo:   () => ruido(0.25, 0.06, 6000),
  rugido:  () => { tono(140, 50, 0.7, 'sawtooth', 0.14); ruido(0.5, 0.12, 500); },
  lanza:   () => { ruido(0.18, 0.1, 2500); tono(500, 250, 0.15, 'triangle', 0.05); },
  gana:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.2, 'triangle', 0.1, i * 0.12)),
  logro:   () => [659, 784, 988, 1319].forEach((f, i) => { tono(f, f, 0.22, 'triangle', 0.1, i * 0.1); tono(f * 2, f * 2, 0.15, 'sine', 0.04, i * 0.1); }),
  pierde:  () => [400, 350, 300, 200].forEach((f, i) => tono(f, f * 0.8, 0.28, 'triangle', 0.12, i * 0.2)),
  menu:    () => tono(660, 880, 0.08, 'triangle', 0.08),
  clic:    () => tono(500, 700, 0.06, 'triangle', 0.07),
  bloque:  () => tono(160, 100, 0.09, 'triangle', 0.1),
};
function sfx(n) {
  try {
    if (!SONIDOS[n]) return;
    if (usarAlt()) { sfxAlt(n); return; }
    SONIDOS[n]();
  } catch (e) {}
}

// --- Instrumentos de la música (suaves, no "de 8 bits") ---
function enviar(g, rev) {
  g.connect(busMusica);
  if (rev) { const s = audioCtx.createGain(); s.gain.value = rev; g.connect(s); s.connect(convolver); }
}
function marimba(f, t, v, dur) {
  if (grabando) { grabando.push({ k: 'm', f, t, v, dur }); return; }
  const a = audioCtx, g = a.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[1, 1], [4, 0.28], [9.2, 0.07]].forEach(([m, amp]) => { const o = a.createOscillator(), ga = a.createGain(); o.type = 'sine'; o.frequency.value = f * m; ga.gain.value = amp; o.connect(ga); ga.connect(g); o.start(t); o.stop(t + dur + 0.05); });
  enviar(g, 0.5);
}
function bajoNota(f, t, v, dur) {
  if (grabando) { grabando.push({ k: 'b', f, t, v, dur }); return; }
  const a = audioCtx, g = a.createGain(), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(900, t); fl.frequency.exponentialRampToValueAtTime(260, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [['triangle', f], ['sine', f / 2]].forEach(([tp, fr]) => { const o = a.createOscillator(); o.type = tp; o.frequency.value = fr; o.connect(fl); o.start(t); o.stop(t + dur + 0.05); });
  fl.connect(g); enviar(g, 0.05);
}
function padNota(f, t, dur, v) {
  if (grabando) { grabando.push({ k: 'p', f, t, v, dur }); return; }
  const a = audioCtx, g = a.createGain(), fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 1100;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.4); g.gain.setValueAtTime(v, t + dur - 0.3); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.3);
  [-6, 6].forEach(d => { const o = a.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = d; o.connect(fl); o.start(t); o.stop(t + dur + 0.4); });
  fl.connect(g); enviar(g, 0.5);
}
function percusion(tipo, t, v) {
  if (grabando) { grabando.push({ k: 'x', tipo, t, v }); return; }
  const a = audioCtx, g = a.createGain();
  if (tipo === 'bombo') { const o = a.createOscillator(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18); o.connect(g); o.start(t); o.stop(t + 0.2); }
  else { const s = a.createBufferSource(), f = a.createBiquadFilter(); s.buffer = bufRuido; f.type = tipo === 'caja' ? 'bandpass' : 'highpass'; f.frequency.value = tipo === 'caja' ? 1900 : 7500;
    const d = tipo === 'caja' ? 0.13 : 0.045; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(f); f.connect(g); s.start(t, Math.random() * 0.4); s.stop(t + d + 0.02); }
  enviar(g, tipo === 'caja' ? 0.2 : 0);
}
const ACORDES = s => s.split(' ').map(x => [parseInt(x), x.endsWith('m') ? 'm' : 'M']);
const MEL = s => s.replace(/\|/g, ' ').trim().split(/\s+/).map(x => x === '.' ? null : parseInt(x));
const CALLE = {
  bpm: 128, sw: 0.1, root: 392, vel: 1, pad: false, bajo: [0, null, 7, null, 0, null, 7, null], comp: [1, 3, 5, 7], bombo: [0, 4], caja: [2, 6], hat: [1, 3, 5, 7],
  acordes: ACORDES('0M 7M 9m 5M 0M 7M 5M 7M 5M 0M 2m 7M 5M 0M 7M 0M'),
  mel: MEL('7 . 12 . 11 9 7 . | 9 . 14 . 12 11 9 . | 11 . 16 . 14 12 11 . | 12 11 9 7 9 . . . | 7 . 12 . 11 9 7 . | 9 . 14 . 12 11 9 7 | 5 7 9 12 11 9 7 5 | 7 . 11 . 14 . . . | 12 . 9 . 12 . 14 . | 16 . 14 . 12 . 11 . | 9 . 12 . 14 12 9 . | 11 . 14 . 11 9 7 . | 12 . 14 . 16 14 12 . | 14 . 12 . 11 . 9 . | 9 11 14 11 9 7 9 11 | 12 . 7 . 4 . . .'),
};
const PISTAS = {

  menu: { ...CALLE, bpm: 92, vel: 0.85, pad: true, bajo: [0, null, null, null, 7, null, null, null], comp: [2, 6], bombo: [], caja: [], hat: [] },
  tarde: {
    bpm: 98, sw: 0.14, root: 329.63, vel: 0.95, pad: true, bajo: [0, null, 7, null, 0, null, null, 7], comp: [1, 3, 5, 7], bombo: [0, 4], caja: [6], hat: [3, 7],
    acordes: ACORDES('0m 8M 3M 10M 0m 8M 10M 0m 5m 8M 3M 10M 5m 8M 10M 0m'),
    mel: MEL('7 . 12 . 10 . 7 . | 8 . 12 . 10 8 7 . | 7 . 10 . 14 . 12 10 | 14 . 10 . 12 . 10 7 | 7 . 12 . 15 . 14 12 | 15 . 12 . 8 . 7 . | 10 . 12 . 14 . 12 10 | 12 . 7 . 3 . . . | 12 . 8 . 5 . 8 12 | 15 . 12 . 8 . 12 . | 14 . 10 . 7 . 10 14 | 17 . 14 . 10 . 14 . | 12 . 15 . 17 . 15 12 | 15 . 12 . 8 . 12 15 | 14 . 10 . 14 . 17 . | 12 . 7 . 3 . 7 .'),

function menuControl() {

    if (pulso('ArrowLeft', 'KeyA') || e[14] || e[100]) { seleccion = (seleccion + PERSONAJES.length - 1) % PERSONAJES.length; if (desbloqueado(PERSONAJES[seleccion])) personaje = PERSONAJES[seleccion]; sfx('menu'); }

    if (pulso('Escape', 'Backspace') || e[8]) irA('menu');
    return;
  }
  if (estado === 'intro') {
    if (ok()) { const total = HISTORIA.join('').length; if (estadoT * VEL_TEXTO() < total) estadoT = 99999; else { sfx('menu'); nuevoJuego(); } }
    if (pulso('Escape')) irA('menu');
    return;
  }
  if ((estado === 'perdio' || estado === 'gano' || estado === 'nivelok') && estadoT <= 45) return;

  const n = ui.rects.filter(r => !r.sinFoco).length, lista = ui.rects.filter(r => !r.sinFoco);
  if (!n) return;
  if (ui.foco >= n) ui.foco = n - 1;
  if (pulso('ArrowDown', 'KeyS') || e[13] || e[103]) { ui.foco = (ui.foco + 1) % n; sfx('clic'); }
  if (pulso('ArrowUp', 'KeyW') || e[12] || e[102]) { ui.foco = (ui.foco + n - 1) % n; sfx('clic'); }
  const r = lista[ui.foco];

  if (r.tipo === 'slider') { if (izq) { r.set(pasoUI(r.get() - r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } if (der) { r.set(pasoUI(r.get() + r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } }
  else if (r.tipo === 'toggle') { if (izq || der || ok()) { r.accion(); sfx('clic'); } }

}
