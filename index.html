<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lichilón y el Patrón</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
  canvas { width: min(100vw, calc(100vh * 16 / 9)); height: auto; touch-action: none; display: block; }

  /* Botones táctiles */
  #tactil { position: fixed; inset: 0; pointer-events: none; display: none; }
  #tactil button {
    position: absolute; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent;
    border-radius: 50%; border: 3px solid rgba(255,255,255,.75); color: #fff; font: bold 15px "Trebuchet MS", sans-serif;
    background: rgba(20,24,60,.38); text-shadow: 0 2px 3px rgba(0,0,0,.7); backdrop-filter: blur(2px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; padding: 0;
  }
  #tactil button.on { background: rgba(255,255,255,.5); transform: scale(.94); }
  #tactil .ico { font-size: 26px; }
  #b-izq   { left: 16px;  bottom: 20px; width: 78px; height: 78px; }
  #b-der   { left: 108px; bottom: 20px; width: 78px; height: 78px; }
  #b-salto { right: 18px; bottom: 22px; width: 96px; height: 96px; background: rgba(60,180,90,.45); }
  #b-patada{ right: 130px; bottom: 26px; width: 78px; height: 78px; background: rgba(240,150,40,.45); }
  #b-poder { right: 50px; bottom: 134px; width: 78px; height: 78px; background: rgba(80,180,255,.5); }
  #girar { position: fixed; inset: 0; background: #0b0b14ee; color: #fff; font: bold 22px "Trebuchet MS", sans-serif;
           display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 5; }
  @media (orientation: portrait) { #girar.on { display: flex; } }
</style>
</head>
<body>
<canvas id="juego" width="1280" height="720"></canvas>
<div id="tactil">
  <button id="b-izq"><span class="ico">◀</span></button>
  <button id="b-der"><span class="ico">▶</span></button>
  <button id="b-patada"><span class="ico">🦶</span>PATEAR</button>
  <button id="b-poder"><span class="ico">❄</span>PODER</button>
  <button id="b-salto"><span class="ico">⬆</span>SALTAR</button>
</div>
<div id="girar">📱↻<br><br>Gira tu celular para jugar</div>
<script>
// ============================================================
//  LICHILÓN Y EL PATRÓN  -  Versión 0.4
//  Historia: el Patrón y la Patrona subieron la renta de los departamentos.
//  Los tres hermanos tienen que derrotarlos para ganar su depa gratis.
//
//  Partes del código:
//   1. Personajes   2. Sonidos   3. Controles   4. Dibujos (niños, enemigos, jefes)
//   5. Escenario de Mérida   6. Niveles   7. Reglas del juego   8. Pantallas   9. Ciclo
// ============================================================

const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');
const W = 800, H = 450;                           // tamaño "lógico" del juego
const ESC = canvas.width / W;                     // el dibujo real es más grande para verse nítido
const T = 32;                                     // tamaño de cada bloque
const FILAS = 14;
const GRAVEDAD = 0.6;
const VIDAS_INICIO = 3, VIDAS_MAX = 5, CHOCOS_POR_VIDA = 3;
const BOTAS_DURACION = 900;                       // 15 segundos

// ---------- 1. PERSONAJES (cambia estos números para inventar ventajas) ----------
const PERSONAJES = [
  { nombre: 'LICHILÓN', vel: 3.4, salto: 13.6, caida: 1.0, maxCaida: 15,
    desc: ['Buen saltador y', 'bastante resistente.'], stats: { vel: 3, salto: 4, caida: 3 }, estilo: 'lichi',
    piel: '#ffd7b5', pelo: ['#ffe680', '#e8b93a'], camisa: ['#5bd174', '#2c9d46'], pantalon: '#3f6fd1', zapato: '#f4f4f4' },
  { nombre: 'JULIÁN CHÓN', vel: 4.1, salto: 12.2, caida: 1.0, maxCaida: 15,
    desc: ['El más rápido,', 'pero salta menos.'], stats: { vel: 4, salto: 2, caida: 3 }, estilo: 'julian',
    piel: '#f6c79a', pelo: ['#a56a3d', '#6b3f20'], camisa: ['#ffe95e', '#f2b81c'], pantalon: '#2d4f8f', zapato: '#e04b3a' },
  { nombre: 'SOFI LOFI', vel: 3.7, salto: 13.2, caida: 0.7, maxCaida: 7.5,
    desc: ['Cae más suave', 'que los demás.'], stats: { vel: 3, salto: 3, caida: 4 }, estilo: 'sofi',
    piel: '#ffd7b5', pelo: ['#ffec7a', '#efc02a'], camisa: ['#ff9ac7', '#ee5498'], pantalon: '#8e63d8', zapato: '#b04bd6' },
];

// ---------- 2. SONIDOS (se fabrican con código, no hay archivos) ----------
let audioCtx = null, silencio = false, musicaOn = false;
function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tono(f1, f2, dur, tipo = 'square', vol = 0.08, retraso = 0) {
  const a = audio(); if (!a || silencio) return;
  const t0 = a.currentTime + retraso, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ruido(dur, vol = 0.1, filtro = 1200) {
  const a = audio(); if (!a || silencio) return;
  const n = Math.floor(a.sampleRate * dur), b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = filtro; g.gain.value = vol;
  s.buffer = b; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const SONIDOS = {
  salto:   () => tono(280, 720, 0.16),
  resorte: () => { tono(200, 900, 0.28, 'triangle', 0.1); tono(400, 1400, 0.2, 'square', 0.04, 0.05); },
  choco:   () => { ruido(0.05, 0.12, 4000); tono(880, 1320, 0.1, 'triangle', 0.09); },
  vida:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.12, 'square', 0.07, i * 0.07)),
  pisoton: () => tono(400, 120, 0.12, 'square', 0.1),
  patada:  () => { ruido(0.12, 0.18, 800); tono(200, 80, 0.1, 'triangle', 0.12); },
  hielo:   () => { tono(1800, 2600, 0.18, 'triangle', 0.08); tono(2400, 3200, 0.14, 'sine', 0.05, 0.05); },
  rompe:   () => { ruido(0.3, 0.2, 5000); tono(1500, 300, 0.25, 'triangle', 0.08); },
  poder:   () => [523, 659, 784, 1047].forEach((f, i) => tono(f, f, 0.12, 'square', 0.07, i * 0.07)),
  escudo:  () => { [392, 523, 659].forEach((f, i) => tono(f, f * 1.5, 0.2, 'triangle', 0.09, i * 0.08)); },
  golpe:   () => tono(500, 100, 0.35, 'sawtooth', 0.1),
  pincho:  () => { tono(900, 150, 0.3, 'sawtooth', 0.1); ruido(0.1, 0.15, 3000); },
  tragar:  () => { tono(300, 60, 0.5, 'sawtooth', 0.12); ruido(0.3, 0.12, 400); },
  siseo:   () => ruido(0.25, 0.06, 6000),
  rugido:  () => { tono(140, 50, 0.7, 'sawtooth', 0.14); ruido(0.5, 0.12, 500); },
  lanza:   () => { ruido(0.18, 0.1, 2500); tono(500, 250, 0.15, 'triangle', 0.05); },
  gana:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.18, 'square', 0.08, i * 0.12)),
  pierde:  () => [400, 350, 300, 200].forEach((f, i) => tono(f, f * 0.8, 0.25, 'triangle', 0.1, i * 0.2)),
  menu:    () => tono(660, 880, 0.08, 'square', 0.06),
  bloque:  () => tono(150, 100, 0.08, 'square', 0.08),
};
const sfx = n => { try { SONIDOS[n](); } catch (e) {} };

// Música de fondo (muy sencilla). Tecla M para quitarla.
const MELODIA = [0,4,7,12,7,4,0,null,2,5,9,14,9,5,2,null,4,7,11,16,11,7,4,null,0,4,7,12,16,12,7,4];
const BAJO    = [0,0,-5,-5,-7,-7,-5,-5];
let pasoMusica = 0;
setInterval(() => {
  if (!musicaOn || silencio || !audioCtx) return;
  const n = MELODIA[pasoMusica % MELODIA.length];
  if (n !== null) tono(261.6 * Math.pow(2, n / 12), 261.6 * Math.pow(2, n / 12), 0.13, 'square', 0.025);
  if (pasoMusica % 4 === 0) { const b = BAJO[(pasoMusica / 4) % BAJO.length]; tono(130.8 * Math.pow(2, b / 12), 130.8 * Math.pow(2, b / 12), 0.4, 'triangle', 0.05); }
  pasoMusica++;
}, 170);

// ---------- 3. CONTROLES ----------
// Teclado: flechas o A/D mover | Espacio, W o ↑ saltar | Z o K patear | X o J poder
// Control (Switch, Xbox, PS): palanca/cruceta mover | A o B saltar | Y patear | X poder
// Pantalla táctil: los 5 botones de la pantalla.
const teclas = {}, pulsos = {}, tactil = {};
let tactilActivo = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pulsos[e.code] = true;
  teclas[e.code] = true;
  audio();
  if (e.code === 'KeyM' && !e.repeat) silencio = !silencio;
});
addEventListener('keyup', e => teclas[e.code] = false);
const pulso = (...cods) => cods.reduce((hay, c) => { const v = pulsos[c]; pulsos[c] = false; return hay || !!v; }, false);

const pad = { held: {}, edge: {}, prev: {} };
function actualizarPad() {
  pad.held = {}; pad.edge = {};
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    p.buttons.forEach((b, i) => { if (b.pressed) pad.held[i] = true; });
    if (p.axes[0] < -0.5) pad.held[100] = true;
    if (p.axes[0] >  0.5) pad.held[101] = true;
  }
  for (const k in pad.held) if (!pad.prev[k]) pad.edge[k] = true;
  pad.prev = pad.held;
}

// Botones táctiles: cada botón registra su dedo con "pointer events" (se pueden apretar varios a la vez)
const BOTONES = { 'b-izq': 'izq', 'b-der': 'der', 'b-salto': 'salto', 'b-patada': 'patada', 'b-poder': 'poder' };
Object.entries(BOTONES).forEach(([id, nombre]) => {
  const el = document.getElementById(id);
  const soltar = () => { tactil[nombre] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); tactilActivo = true; audio();
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    tactil[nombre] = true; el.classList.add('on');
    if (nombre === 'patada') pulsos.TactilPatada = true;
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, soltar));
  el.addEventListener('contextmenu', e => e.preventDefault());
});
document.addEventListener('contextmenu', e => { if (tactilActivo) e.preventDefault(); });

function leerControles() {
  const h = pad.held, e = pad.edge;
  return {
    izq: teclas.ArrowLeft || teclas.KeyA || h[14] || h[100] || tactil.izq,
    der: teclas.ArrowRight || teclas.KeyD || h[15] || h[101] || tactil.der,
    salto: teclas.Space || teclas.ArrowUp || teclas.KeyW || h[0] || h[1] || tactil.salto,
    patada: pulso('KeyZ', 'KeyK', 'TactilPatada') || e[2],
    poder: pulso('KeyX', 'KeyJ') || e[3] || e[5] || e[7] || tactil.poder,
  };
}

// ---------- 4. DIBUJOS ----------
function crearCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function azar(n) { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
function grad(g, x0, y0, x1, y1, paradas) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  paradas.forEach(([p, c]) => gr.addColorStop(p, c)); return gr;
}
function trazoRedondo(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
const hex2rgb = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const sombrear = (hex, f) => { const [r, g, b] = hex2rgb(hex); const c = v => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const aclarar  = (hex, f) => { const [r, g, b] = hex2rgb(hex); const c = v => Math.round(v + (255 - v) * f); return `rgb(${c(r)},${c(g)},${c(b)})`; };
const CONTORNO = '#3a2418';

// --- Los niños (dibujados, con contorno de caricatura) ---
function miembro(g, hx, hy, ang, largo, ancho, color) {
  const ex = hx + Math.sin(ang) * largo, ey = hy + Math.cos(ang) * largo;
  g.lineCap = 'round';
  g.strokeStyle = CONTORNO; g.lineWidth = ancho + 2.4; g.beginPath(); g.moveTo(hx, hy); g.lineTo(ex, ey); g.stroke();
  g.strokeStyle = color; g.lineWidth = ancho; g.beginPath(); g.moveTo(hx, hy); g.lineTo(ex, ey); g.stroke();
  return [ex, ey];
}
function mano(g, [x, y], piel) {
  g.fillStyle = piel; g.strokeStyle = CONTORNO; g.lineWidth = 1.2; g.beginPath(); g.arc(x, y, 3.3, 0, 7); g.fill(); g.stroke();
}
function zapato(g, [x, y], pj, ang, botas) {
  g.save(); g.translate(x, y); g.rotate(-ang);
  if (botas) {                                              // resorte debajo de la bota
    g.strokeStyle = '#b8bcc8'; g.lineWidth = 1.8; g.beginPath(); g.moveTo(-1, 2);
    for (let i = 0; i < 4; i++) g.lineTo(i % 2 ? -2 : 6, 3 + i * 1.6); g.stroke();
    g.strokeStyle = '#6b7080'; g.lineWidth = .8; g.stroke();
  }
  g.fillStyle = botas ? '#ff8a1f' : pj.zapato; g.strokeStyle = CONTORNO; g.lineWidth = 1.4;
  g.beginPath(); g.ellipse(2.2, -1, 7, 4.2, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.2)'; g.fillRect(-3, 1.2, 10, 1.6);
  g.fillStyle = 'rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(3, -3, 3, 1, 0, 0, 7); g.fill();
  g.restore();
}
function dibujarNino(g, pj, x, y, esc, dir, pose) {
  const t = pose.t || 0, cy = -45;
  let aPF = 0, aPT = 0, aBF = 0.1, aBT = -0.1, bob = 0, boca = false;
  if (pose.estado === 'camina') { const f = Math.sin(pose.fase); aPF = f * 0.8; aPT = -f * 0.8; aBF = -f * 0.9; aBT = f * 0.9; bob = -Math.abs(Math.cos(pose.fase)) * 1.6; }
  else if (pose.estado === 'salta') { aPF = 0.75; aPT = -0.4; aBF = 2.5; aBT = 2.1; boca = true; }
  else if (pose.estado === 'patea') { aPF = 1.55; aPT = -0.2; aBF = -1.0; aBT = 1.2; boca = true; }
  else { bob = Math.sin(t * 0.08) * 0.6; }
  g.save(); g.translate(x, y); g.scale(dir * esc, esc); g.lineJoin = 'round';
  const falda = pj.estilo === 'sofi';
  if (!pose.aire) { g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(0, 1, 13, 3.2, 0, 0, 7); g.fill(); }
  const peloG = grad(g, 0, cy - 14, 0, cy + 14, [[0, pj.pelo[0]], [1, pj.pelo[1]]]);
  g.save(); g.translate(0, bob);
  if (pj.estilo === 'sofi') {                                  // rizos de atrás
    g.fillStyle = peloG; g.strokeStyle = '#b8901c'; g.lineWidth = 1.2;
    for (let i = 0; i < 11; i++) { const a = Math.PI * 0.9 + i * (Math.PI * 1.25 / 10); g.beginPath(); g.arc(Math.cos(a) * 12.5, cy + Math.sin(a) * 12.5 - 1, 5.6, 0, 7); g.fill(); g.stroke(); }
    [[-14, cy + 2], [-14.5, cy + 9], [-12, cy + 15], [13.5, cy + 2], [14, cy + 9], [11.5, cy + 15]].forEach(([cx, ccy]) => { g.beginPath(); g.arc(cx, ccy, 4.8, 0, 7); g.fill(); g.stroke(); });
  }
  g.restore();
  const caderaY = -16, pieA = miembro(g, -3.5, caderaY + bob, aPT, 16.5, 6, pj.piel);
  zapato(g, pieA, pj, aPT, pose.botas);
  g.save(); g.translate(0, bob);
  const camG = grad(g, -9, -36, 9, -18, [[0, pj.camisa[0]], [0.6, pj.camisa[1]], [1, sombrear(pj.camisa[1].length === 7 ? pj.camisa[1] : '#2c9d46', .8)]]);
  const manoT = miembro(g, -8, -31, aBT, 12.5, 5.4, pj.piel);
  miembro(g, -8, -31, aBT, 5, 6, pj.camisa[1]);
  mano(g, manoT, pj.piel);
  g.fillStyle = camG; g.strokeStyle = CONTORNO; g.lineWidth = 1.5;
  trazoRedondo(g, -9.5, -36, 19, 19, 5); g.fill(); g.stroke();
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(4, -35, 4.5, 17);
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-8, -20.5); g.lineTo(8, -20.5); g.stroke();
  if (falda) {                                                  // corazón en la camisa
    g.fillStyle = '#fff'; g.beginPath(); g.arc(-1.8, -28, 2.1, 0, 7); g.arc(1.8, -28, 2.1, 0, 7); g.fill();
    g.beginPath(); g.moveTo(-3.8, -27.4); g.lineTo(3.8, -27.4); g.lineTo(0, -23); g.fill();
  } else if (pj.estilo === 'julian') {
    g.fillStyle = 'rgba(180,110,0,.35)'; g.fillRect(-9, -29, 18, 2.5);
  } else {
    g.fillStyle = '#fff'; g.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? 1.6 : 3.4, a = -Math.PI / 2 + i * Math.PI / 5; g.lineTo(Math.cos(a) * r, -27 + Math.sin(a) * r); } g.fill();
  }
  g.fillStyle = pj.piel; g.beginPath(); g.moveTo(-3.5, -36); g.quadraticCurveTo(0, -31, 3.5, -36); g.fill();
  g.fillStyle = pj.pantalon; g.strokeStyle = CONTORNO; g.lineWidth = 1.5;
  if (falda) { g.beginPath(); g.moveTo(-8.5, -20); g.lineTo(8.5, -20); g.lineTo(13, -10.5); for (let i = 0; i < 4; i++) g.quadraticCurveTo(9.7 - i * 6.5, -7.5, 6.5 - i * 6.5, -10.5); g.lineTo(-13, -10.5); g.closePath(); }
  else trazoRedondo(g, -9.5, -21, 19, 10, 3);
  g.fill(); g.stroke();
  g.restore();
  const pieF = miembro(g, 3.5, caderaY + bob, aPF, 16.5, 6, pj.piel);
  zapato(g, pieF, pj, aPF, pose.botas);
  g.save(); g.translate(0, bob);
  const manoF = miembro(g, 8, -31, aBF, 12.5, 5.4, pj.piel);
  miembro(g, 8, -31, aBF, 5, 6, pj.camisa[0]);
  mano(g, manoF, pj.piel);
  g.fillStyle = grad(g, -10, cy - 12, 10, cy + 12, [[0, pj.piel], [1, '#f2b88e']]); g.strokeStyle = CONTORNO; g.lineWidth = 1.6;
  g.beginPath(); g.arc(0, cy, 11.8, 0, 7); g.fill(); g.stroke();
  g.fillStyle = pj.piel; g.beginPath(); g.arc(-11, cy + 2, 3, 0, 7); g.fill(); g.stroke();
  g.fillStyle = peloG; g.strokeStyle = pj.estilo === 'sofi' ? '#b8901c' : '#5a3a14'; g.lineWidth = 1.4;
  if (pj.estilo === 'sofi') {
    [[8.5, cy - 8], [3.5, cy - 11.5], [-2.5, cy - 11.5], [-8, cy - 8], [-11, cy - 2]].forEach(([cx, ccy]) => { g.beginPath(); g.arc(cx, ccy, 4.6, 0, 7); g.fill(); g.stroke(); });
  } else {
    if (pj.estilo === 'julian') {
      [[-8, cy - 8, -5, cy - 18, -1, cy - 11], [-2, cy - 11, 3, cy - 19, 7, cy - 10], [5, cy - 10, 11, cy - 15, 12, cy - 5]].forEach(([a, b, c, d, e, f]) => { g.beginPath(); g.moveTo(a, b); g.lineTo(c, d); g.lineTo(e, f); g.closePath(); g.fill(); g.stroke(); });
    } else {
      g.beginPath(); g.moveTo(-3, cy - 11); g.quadraticCurveTo(-1, cy - 19, 5, cy - 16); g.quadraticCurveTo(2, cy - 13, 3, cy - 10); g.closePath(); g.fill(); g.stroke();
    }
    g.beginPath(); g.arc(0, cy - 0.5, 12.3, Math.PI * 0.96, Math.PI * 2.04);

function dibujarJugador() {
  const p = jugador;
  if (tragando > 0 && tragando < 40) return;
  if (p.invulnerable > 0 && !escudo && Math.floor(p.invulnerable / 4) % 2) return;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  if (poder) resplandor(ctx, cx, cy, 40, 'rgba(150,225,255,.6)');
  const estadoP = p.patada > 0 ? 'patea' : !p.enSuelo ? 'salta' : p.vx ? 'camina' : 'quieto';
  dibujarNino(ctx, personaje, cx, p.y + p.h, 0.8, p.mirando, { estado: estadoP, fase: p.pasos * 0.2, t: reloj, aire: !p.enSuelo, botas: botas > 0 });
  if (p.patada > 0) {
    const d = p.mirando, a = p.patada / 14;
    ctx.strokeStyle = `rgba(255,255,255,${a * 0.8})`; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, p.y + p.h - 12, 26, d > 0 ? -0.9 : Math.PI - 0.3, d > 0 ? 0.3 : Math.PI + 0.9, d < 0); ctx.stroke();
  }
  if (escudo) {                                             // círculo protector amarillo
    const r = 33 + Math.sin(reloj * 0.15) * 1.5;
    const gr = ctx.createRadialGradient(cx, cy, r * 0.4, cx, cy, r); gr.addColorStop(0, 'rgba(255,240,120,.06)'); gr.addColorStop(0.75, 'rgba(255,225,60,.26)'); gr.addColorStop(1, 'rgba(255,200,0,.55)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,80,.95)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(cx, cy, r - 3, reloj * 0.06, reloj * 0.06 + 0.9); ctx.stroke();
  }
}
function dibujarNivel() {
  const c0 = Math.max(0, Math.floor(camara / T)), c1 = Math.min(COLS - 1, c0 + Math.ceil(W / T) + 1);
  const tarde = tema === 'tarde';
  for (const d of decoraciones) if (d.x > camara - 50 && d.x < camara + W + 50) dibujarDecoracion(d, tarde);
  for (let c = c0; c <= c1; c++) if (mapa[12][c] === ' ') {                             // zanjas
    const gr = ctx.createLinearGradient(0, 12 * T, 0, H); gr.addColorStop(0, '#2a1d14'); gr.addColorStop(1, '#0c0806'); ctx.fillStyle = gr; ctx.fillRect(c * T, 12 * T, T + 0.5, H - 12 * T + 40);
    if (mapa[12][c - 1] === '#') { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(c * T, 12 * T, 6, 100); }
  }
  for (let r = 0; r < FILAS; r++) for (let c = c0; c <= c1; c++) {
    const ch = mapa[r][c]; if (ch === ' ') continue;
    const k = r + ',' + c, dy = rebote[k] ? -Math.sin(rebote[k] / 8 * Math.PI) * 8 : 0, x = c * T, y = r * T + dy;
    if (ch === '^') { dibujarPincho(ctx, x, y); continue; }
    if (ch === '#' && r >= 12) { ctx.drawImage(r === 12 ? TILE_BANQUETA : TILE_BASE, x, y, T + 0.5, T + 0.5); continue; }
    if (ch === '#') { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x + 2, y + T, T - 2, 5); }
    const tile = ch === '#' ? TILE_CANTERA : (usados[k] ? TILE_CAJA_USADA : TILE_CAJA);
    ctx.drawImage(tile, x, y, T + 0.5, T + 0.5);
  }
}
function dibujarMarcador() {
  ctx.fillStyle = 'rgba(25,20,60,.58)'; trazoRedondo(ctx, 6, 6, W - 12, 52, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(32, 32, 22, 0, 7); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 0, 70, 70);
  dibujarNino(ctx, personaje, 32, 70, 0.95, 1, { estado: 'quieto', t: reloj }); ctx.restore();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(32, 32, 22, 0, 7); ctx.stroke();
  texto(personaje.nombre, 62, 27, 14); texto(String(puntos).padStart(6, '0'), 62, 49, 17, '#ffd700');
  dibujarChoco(ctx, { x: 176, y: 20, w: 24, h: 16 });
  for (let i = 0; i < CHOCOS_POR_VIDA; i++) { ctx.fillStyle = i < progChoco ? '#ff4b4b' : 'rgba(255,255,255,.28)'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(224 + i * 15, 31, 5.2, 0, 7); ctx.fill(); ctx.stroke(); }
  texto('= 1 vida', 272, 36, 11, '#fff');
  // power-ups activos
  let px = 345;
  const casilla = (activo, dibujo, txt, col) => { ctx.fillStyle = activo ? 'rgba(255,255,255,.2)' : 'rgba(0,0,0,.22)'; trazoRedondo(ctx, px, 14, 36, 36, 9); ctx.fill(); ctx.strokeStyle = activo ? col : 'rgba(255,255,255,.2)'; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = activo ? 1 : 0.28; dibujo(); ctx.globalAlpha = 1; px += 42; };
  casilla(!!poder, () => { ctx.save(); ctx.translate(px + 18, 32); ctx.scale(0.6, 0.6); dibujarCristal(ctx, -12, -12); ctx.restore(); }, '', '#9be4ff');
  casilla(escudo, () => dibujarEscudoIcono(ctx, px + 8, 19, 0.7), '', '#ffd93b');
  casilla(botas > 0, () => { ctx.save(); ctx.translate(px + 18, 32); ctx.scale(0.62, 0.62); dibujarIconoBotas(ctx, -12, -12); ctx.restore(); if (botas > 0) { ctx.fillStyle = '#ffae4d'; ctx.fillRect(px + 4, 46, 28 * botas / BOTAS_DURACION, 3); } }, '', '#ffae4d');
  for (let i = 0; i < VIDAS_MAX; i++) corazon(W - 28 - (VIDAS_MAX - 1 - i) * 30 - 10, 14, 22, i < vidas ? '#ff3d7f' : 'rgba(255,255,255,.2)', i < vidas ? '#7a0a3a' : 'rgba(255,255,255,.35)');
  texto(NIVELES[nivelActual].nombre, W - 92, 53, 11, '#cfd8ff', 'center');
  if (silencio) texto('SIN SONIDO (M)', W - 190, 53, 10, '#fff', 'center');
  if (jefe && jefe.vivo && jefe.estadoJ === 'activo') {                                // barra del jefe
    const bw = 300, bx = W / 2 - bw / 2, by = 66, f = Math.max(0, jefe.hp / jefe.hpMax);
    ctx.fillStyle = 'rgba(20,10,30,.75)'; trazoRedondo(ctx, bx - 4, by - 4, bw + 8, 24, 10); ctx.fill();
    ctx.fillStyle = grad(ctx, 0, by, 0, by + 16, [[0, '#ff8a8a'], [1, '#c4161c']]); trazoRedondo(ctx, bx, by, bw * f, 16, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; trazoRedondo(ctx, bx, by, bw, 16, 7); ctx.stroke();
    texto(jefe.tipo === 'patron' ? 'EL PATRÓN' : 'LA PATRONA', W / 2, by + 13, 12, '#fff', 'center');
  }
}
function dibujarJuego() {
  dibujarFondo(camara, tema);
  const sx = temblor > 0 ? (Math.random() - 0.5) * temblor * 0.6 : 0, sy = temblor > 0 ? (Math.random() - 0.5) * temblor * 0.5 : 0;
  ctx.save(); ctx.translate(-Math.round(camara * ESC) / ESC + sx, sy);
  dibujarEdificioFinal(arenaX, tema === 'tarde');
  dibujarNivel();
  for (const m of chocosVivos) if (!m.tomado) dibujarChoco(ctx, m);
  for (const it of items) { const y = it.y + Math.sin(reloj * 0.1) * 2; if (it.tipo === 'hielo') dibujarCristal(ctx, it.x, y); else if (it.tipo === 'botas') dibujarIconoBotas(ctx, it.x, y); else dibujarEscudoIcono(ctx, it.x, y); }
  for (const e of escarabajos) if (e.vivo) dibujarEscarabajo(ctx, e, reloj);
  for (const m of murcielagos) if (m.vivo) dibujarMurcielago(ctx, m, reloj);
  for (const s of serpientes) if (s.vivo) dibujarSerpiente(ctx, s);
  if (jefe && (jefe.vivo || jefe.muerte < 100)) { if (!jefe.vivo) ctx.globalAlpha = Math.max(0, 1 - jefe.muerte / 100); dibujarJefe(ctx, jefe, reloj); ctx.globalAlpha = 1; }
  for (const q of proyJ) dibujarProyectil(ctx, q);
  for (const b of balas) dibujarBola(ctx, b);
  dibujarJugador();
  for (const pa of particulas) { ctx.globalAlpha = Math.min(1, pa.vida / 15); ctx.fillStyle = pa.color; ctx.beginPath(); ctx.arc(pa.x, pa.y, pa.tam, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (tema === 'tarde') { ctx.fillStyle = 'rgba(255,120,60,.10)'; ctx.fillRect(0, 0, W, H); }
  const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.55, W / 2, H / 2, H * 1.0); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(10,5,25,.32)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
  dibujarMarcador();
  if (banner > 0 && estado === 'jugando') {
    const a = Math.min(1, banner / 30, (170 - banner) / 20), N = NIVELES[nivelActual]; ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(15,10,40,.7)'; trazoRedondo(ctx, W / 2 - 230, 130, 460, 86, 16); ctx.fill();
    texto(N.nombre, W / 2, 170, 30, '#ffd700', 'center'); texto(N.lugar, W / 2, 202, 17, '#fff', 'center'); ctx.globalAlpha = 1;
  }
}
function panel(titulo, lineas, color, pie) {
  ctx.fillStyle = 'rgba(10,6,30,.78)'; ctx.fillRect(0, 0, W, H);
  texto(titulo, W / 2, 110, 36, color, 'center');
  lineas.forEach((l, i) => texto(l, W / 2, 165 + i * 27, 17, '#fff', 'center'));
  if (estadoT > 45) texto(pie, W / 2, 415, 16, '#ffd700', 'center');
}
const TARJETA = i => ({ x: 40 + i * 252, y: 150, w: 228, h: 250 });
function dibujarSeleccion() {
  dibujarFondo(reloj * 1.2, 'dia');
  ctx.fillStyle = 'rgba(10,6,40,.3)'; ctx.fillRect(0, 0, W, H);
  texto('LICHILÓN Y EL PATRÓN', W / 2, 54, 40, '#ffd700', 'center');
  texto('¡Subieron la renta! Derrota al Patrón y a la Patrona y gana tu depa gratis.', W / 2, 88, 14, '#fff', 'center');
  texto('Elige tu personaje', W / 2, 128, 20, '#fff', 'center');
  PERSONAJES.forEach((pj, i) => {
    const t = TARJETA(i), sel = i === seleccion, dy = sel ? -Math.abs(Math.sin(reloj * 0.1)) * 6 : 0;
    if (sel) { ctx.fillStyle = '#ffd700'; trazoRedondo(ctx, t.x - 4, t.y - 4 + dy, t.w + 8, t.h + 8, 16); ctx.fill(); }
    ctx.fillStyle = sel ? '#2b3a67' : 'rgba(20,24,50,.82)'; trazoRedondo(ctx, t.x, t.y + dy, t.w, t.h, 13); ctx.fill();
    dibujarNino(ctx, pj, t.x + t.w / 2, t.y + 112 + dy, 1.75, 1, { estado: sel ? 'camina' : 'quieto', fase: reloj * 0.18, t: reloj, aire: false });
    texto(pj.nombre, t.x + t.w / 2, t.y + 134 + dy, 18, sel ? '#ffd700' : '#fff', 'center');
    pj.desc.forEach((l, k) => texto(l, t.x + t.w / 2, t.y + 156 + k * 17 + dy, 13, '#cfd8ff', 'center'));
    [['Velocidad', 'vel'], ['Salto', 'salto'], ['Caída suave', 'caida']].forEach(([nombre, k], j) => {
      texto(nombre, t.x + 12, t.y + 204 + j * 18 + dy, 12, '#fff');
      for (let b = 0; b < 5; b++) { ctx.fillStyle = b < pj.stats[k] ? '#7bd36b' : '#3a3f5c'; trazoRedondo(ctx, t.x + 120 + b * 20, t.y + 194 + j * 18 + dy, 16, 10, 3); ctx.fill(); }
    });
  });
  texto(tactilActivo ? 'Toca un personaje para jugar' : '← →  elegir      ENTER / ESPACIO  jugar      M  sonido', W / 2, 430, 15, '#fff', 'center');
}
function dibujar() {
  ctx.setTransform(ESC, 0, 0, ESC, 0, 0);
  const toca = tactilActivo ? 'Toca la pantalla' : 'Presiona ENTER';
  if (estado === 'elegir') dibujarSeleccion();
  else if (estado === 'intro') {
    dibujarFondo(reloj * 1.2, 'dia');
    panel('LA HISTORIA', [
      'En la Calle 60 de Mérida, Yucatán, viven tres hermanos:',
      'Lichilón, Julián Chón y Sofi Lofi.',
      '',
      'Pero el Patrón y la Patrona, dueños de los departamentos,',
      '¡les SUBIERON LA RENTA y ya no les alcanza!',
      '',
      'Derrota al Patrón y a la Patrona',
      'y gana tu departamento GRATIS.'], '#ffd700', toca + ' para empezar');
  } else {
    dibujarJuego();
    if (estado === 'perdio') panel('¡GAME OVER!', ['El Patrón y la Patrona se quedaron con el depa...', 'Puntos: ' + puntos], '#ff6b6b', toca + ' para intentarlo otra vez');
    if (estado === 'nivelok') panel('¡DERROTASTE AL PATRÓN!', ['Pero todavía falta la Patrona...', 'Sigue por el Paseo de Montejo al atardecer.', '', 'Puntos: ' + puntos], '#6bff8a', toca + ' para el Nivel 2');
    if (estado === 'gano') panel('¡DEPARTAMENTO GRATIS!', ['Derrotaste al Patrón y a la Patrona.', 'Los tres hermanos ya tienen su departamento.', '', 'Puntos: ' + puntos], '#6bff8a', toca + ' para jugar otra vez');
  }
}

// ---------- 9. CICLO PRINCIPAL ----------
function menuControl() {
  const e = pad.edge, ok = () => pulso('Enter', 'Space') || e[0] || e[1] || e[9];
  if (estado === 'elegir') {
    if (pulso('ArrowLeft', 'KeyA') || e[14] || e[100]) { elegirPersonaje((seleccion + 2) % 3); sfx('menu'); }
    if (pulso('ArrowRight', 'KeyD') || e[15] || e[101]) { elegirPersonaje((seleccion + 1) % 3); sfx('menu'); }
    if (ok()) { sfx('menu'); irA('intro'); }
  } else if (estadoT > 45) {
    if (estado === 'intro' && ok()) { sfx('menu'); nuevoJuego(); }
    else if (estado === 'nivelok' && ok()) { sfx('menu'); siguienteNivel(); }
    else if ((estado === 'perdio' || estado === 'gano') && ok()) { sfx('menu'); irA('elegir'); }
  }
}
canvas.addEventListener('pointerdown', ev => {
  audio();
  if (ev.pointerType === 'touch') tactilActivo = true;
  const r = canvas.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width, y = (ev.clientY - r.top) * H / r.height;
  if (estado === 'elegir') {
    PERSONAJES.forEach((_, i) => { const t = TARJETA(i); if (x > t.x && x < t.x + t.w && y > t.y && y < t.y + t.h) { if (seleccion === i) irA('intro'); else { elegirPersonaje(i); sfx('menu'); } } });
  } else if (estadoT > 45) {
    if (estado === 'intro') nuevoJuego();
    else if (estado === 'nivelok') siguienteNivel();
    else if (estado === 'perdio' || estado === 'gano') irA('elegir');
  }
});

const domTactil = document.getElementById('tactil'), domGirar = document.getElementById('girar');
cargarNivel(0);
function ciclo() {
  actualizarPad(); menuControl(); actualizar(); dibujar();
  const verBotones = tactilActivo && estado === 'jugando';
  domTactil.style.display = verBotones ? 'block' : 'none';
  domGirar.classList.toggle('on', tactilActivo);
  if (!verBotones) for (const k in tactil) tactil[k] = false;
  requestAnimationFrame(ciclo);
}
ciclo();
</script>
