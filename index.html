// ---------- AJUSTES Y DATOS GUARDADOS ----------
const CLAVE_GUARDADO = 'lichilon_departamentos_v2', CLAVE_VIEJA = 'lichilon_departamentos_v1';   // v2 = partida nueva (el progreso anterior se borró a propósito)

function cargarPerfil(i) {

}
try {

  }

  perfiles = [0, 1, 2, 3].map(i => (g.perfiles && g.perfiles[i]) || null);
  perfilActual = perfiles[g.actual] ? g.actual : Math.max(0, perfiles.findIndex(p => p));
  if (!perfiles[perfilActual]) perfiles[perfilActual] = perfilNuevo('Jugador 1');
  cargarPerfil(perfilActual);
} catch (e) { perfiles[0] = perfilNuevo('Jugador 1'); perfilActual = 0; cargarPerfil(0); }
function guardarDatos() {
  try {
    perfiles[perfilActual] = { nombre: datos.nombre, logros: datos.logros, stats: datos.stats, mejor: datos.mejor, prog: datos.prog, intro: true, monedas: datos.monedas, tienda: datos.tienda, creado: datos.creado };
    localStorage.setItem(CLAVE_PERFILES, JSON.stringify({ actual: perfilActual, ajustes: datos.ajustes, perfiles })); return true;
  } catch (e) { return false; }
}
function cambiarPerfil(i) { guardarDatos(); perfilActual = i; cargarPerfil(i); guardarDatos(); avisos = []; }
const NOMBRES_PERFIL = ['Jugador 1', 'Jugador 2', 'Jugador 3', 'Jugador 4', 'Lichilón', 'Julián', 'Sofi', 'Familia', 'Campeón', 'Yucateco', 'Explorador', 'Superhéroe'];
let aj = { ...datos.ajustes };                              // ajustes en uso (se pueden mover sin guardar)
function guardarAjustes() { datos.ajustes = { ...aj }; return guardarDatos(); }
function descartarAjustes() { aj = { ...datos.ajustes }; aplicarVolumen(); if (typeof calidad !== 'undefined' && aj.calidad !== calidad) aplicarCalidad(aj.calidad); }

// ---------- 2. SONIDOS Y MÚSICA (todo se fabrica con código, no hay archivos) ----------
// Hay dos formas de reproducirlo, por si un dispositivo bloquea una de ellas:
//  - Normal: Web Audio (instrumentos en vivo).
//  - Compatible: se crean archivos de audio (.wav) con código y se tocan con <audio>. Se activa solo si el sonido normal no arranca,
//    o a mano en Ajustes > "Sonido compatible".
let audioCtx = null, silencio = false, master = null, busSfx = null, busMusica = null, convolver = null, bufRuido = null;
const SR = 22050;                                           // calidad de los archivos del modo compatible
let grabando = null, respaldoAuto = false, audioMusicaEl = null, silencioEl = null, cacheSfx = {}, poolSfx = {}, cacheMusica = {}, musicaAltPend = null, intentosAudio = 0, silencioURL = null;
const usarAlt = () => aj.compatible || respaldoAuto || !(window.AudioContext || window.webkitAudioContext);

function audio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); crearBuses(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state !== 'running') { try { audioCtx.resume(); } catch (e) {} }
  return audioCtx;
}
function crearBuses() {
  const a = audioCtx; master = a.createGain();
  const comp = a.createDynamicsCompressor(); master.connect(comp); comp.connect(a.destination);
  busSfx = a.createGain(); busSfx.connect(master); busMusica = a.createGain(); busMusica.connect(master);
  convolver = a.createConvolver();
  const n = Math.floor(a.sampleRate * 1.7), buf = a.createBuffer(2, n, a.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
  convolver.buffer = buf; const rev = a.createGain(); rev.gain.value = 0.35; convolver.connect(rev); rev.connect(master);
  const rb = a.createBuffer(1, a.sampleRate, a.sampleRate), rd = rb.getChannelData(0); for (let i = 0; i < rd.length; i++) rd[i] = Math.random() * 2 - 1; bufRuido = rb;
  aplicarVolumen();
}
let bajaMusica = 1;                                          // en las cinemáticas la música se baja para que se oigan mejor los diálogos
function aplicarVolumen() {
  if (audioCtx && master) { master.gain.value = silencio ? 0 : 1.8; busSfx.gain.value = aj.efectos; busMusica.gain.value = aj.musica * bajaMusica; }
  if (audioMusicaEl) audioMusicaEl.volume = silencio ? 0 : Math.min(1, aj.musica * bajaMusica);
}
// Desbloquea el audio con cualquier toque o tecla (los navegadores, sobre todo en celular, lo exigen)
let audioOk = false;
function desbloquearAudio() {
  if (audioOk) { if (musicaAltPend) musicaAltPend(); return; }
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  const a = audio();
  if (a) { try { const b = a.createBuffer(1, 1, 22050), s = a.createBufferSource(); s.buffer = b; s.connect(a.destination); s.start(0); } catch (e) {} }
  try {                                                      // truco para que el iPhone/iPad no lo silencie con el switch de timbre
    if (!silencioEl) { silencioURL = silencioURL || wavUrl(new Float32Array(2205)); silencioEl = new Audio(silencioURL); silencioEl.loop = true; silencioEl.volume = 0.02; }
    silencioEl.play().then(() => { if (usarAlt()) audioOk = true; }).catch(() => {});
  } catch (e) {}
  if (musicaAltPend) musicaAltPend();
  intentosAudio++;
  if (audioCtx && audioCtx.state === 'running') audioOk = true;
  setTimeout(() => { if ((!audioCtx || audioCtx.state !== 'running') && !respaldoAuto && intentosAudio >= 2) { respaldoAuto = true; reiniciarMusica(); } }, 900);
}
['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'].forEach(ev => addEventListener(ev, desbloquearAudio, { passive: true }));
function estadoSonido() {
  if (silencio) return 'mute';
  if (usarAlt()) return 'alt';
  return audioCtx && audioCtx.state === 'running' ? 'ok' : 'toca';
}

// --- Notas, ruidos y la voz del "¡ouch!". Si se está "grabando", solo se anotan para fabricar el archivo .wav ---
function tono(f1, f2, dur, tipo = 'square', vol = 0.08, retraso = 0) {
  if (grabando) { grabando.push({ k: 't', f1, f2, dur, tipo, vol, ret: retraso }); return; }
  const a = audio(); if (!a) return;
  const t0 = a.currentTime + retraso, o = a.createOscillator(), g = a.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(busSfx); o.start(t0); o.stop(t0 + dur + 0.02);
}
function ruido(dur, vol = 0.1, filtro = 1200, tipoFiltro = 'lowpass', retraso = 0) {
  if (grabando) { grabando.push({ k: 'r', dur, vol, fil: filtro, tf: tipoFiltro, ret: retraso }); return; }
  const a = audio(); if (!a) return;
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t0 = a.currentTime + retraso;
  f.type = tipoFiltro; f.frequency.value = filtro; s.buffer = bufRuido;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(busSfx); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.02);
}
// Voz de "¡ouch!": una vocal que se desliza de "o" a "u" y termina con un "ch"
function voz(grave) {
  if (grabando) { grabando.push({ k: 'v', grave }); return; }
  const a = audio(); if (!a) return;
  const t = a.currentTime, dur = 0.42, o = a.createOscillator(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(grave * 1.5, t); o.frequency.exponentialRampToValueAtTime(grave * 0.85, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  [[780, 430, 1], [1220, 780, 0.55]].forEach(([f0, f1, amp]) => {
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 7; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const ga = a.createGain(); ga.gain.value = amp; o.connect(f); f.connect(ga); ga.connect(g);
  });
  g.connect(busSfx); o.start(t); o.stop(t + dur + 0.03);
  ruido(0.09, 0.22, 3500, 'highpass', dur - 0.06);
}
const SONIDOS = {
  salto:   () => { tono(300, 760, 0.17, 'triangle', 0.1); tono(600, 1200, 0.1, 'sine', 0.04, 0.03); },
  resorte: () => { tono(200, 900, 0.28, 'triangle', 0.12); tono(400, 1500, 0.2, 'sine', 0.06, 0.05); },

  vida:    () => [523, 659, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.14, 'triangle', 0.09, i * 0.07)),
  pisoton: () => { tono(420, 120, 0.12, 'triangle', 0.12); ruido(0.06, 0.1, 1500); },

  rompe:   () => { ruido(0.3, 0.2, 5000); tono(1500, 300, 0.25, 'triangle', 0.08); },
  poder:   () => [523, 659, 784, 1047].forEach((f, i) => tono(f, f, 0.12, 'triangle', 0.09, i * 0.07)),
  escudo:  () => { [392, 523, 659].forEach((f, i) => tono(f, f * 1.5, 0.2, 'triangle', 0.1, i * 0.08)); },
  golpe:   () => { tono(260, 70, 0.3, 'sawtooth', 0.1); ruido(0.1, 0.15, 1200); },
  ouch:    () => voz(personaje.voz),
  pincho:  () => { tono(900, 150, 0.25, 'sawtooth', 0.09); ruido(0.1, 0.12, 3000); },
  tragar:  () => { tono(300, 60, 0.5, 'sawtooth', 0.12); ruido(0.3, 0.12, 400); },
  siseo:   () => ruido(0.25, 0.06, 6000),
  rugido:  () => { tono(140, 50, 0.7, 'sawtooth', 0.14); ruido(0.5, 0.12, 500); },
  lanza:   () => { ruido(0.18, 0.1, 2500); tono(500, 250, 0.15, 'triangle', 0.05); },
  gana:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tono(f, f, 0.2, 'triangle', 0.1, i * 0.12)),
  logro:   () => [659, 784, 988, 1319].forEach((f, i) => { tono(f, f, 0.22, 'triangle', 0.1, i * 0.1); tono(f * 2, f * 2, 0.15, 'sine', 0.04, i * 0.1); }),
  pierde:  () => [400, 350, 300, 200].forEach((f, i) => tono(f, f * 0.8, 0.28, 'triangle', 0.12, i * 0.2)),
  menu:    () => tono(660, 880, 0.08, 'triangle', 0.08),

// Voces: cada letra que se "dice" hace un piipito corto; el tono cambia según la letra y la voz de cada personaje
const HABLAS = [{ b: 430, t: 'triangle', v: 0.09 }, { b: 340, t: 'triangle', v: 0.09 }, { b: 560, t: 'triangle', v: 0.09 }, { b: 135, t: 'sawtooth', v: 0.06 }, { b: 400, t: 'square', v: 0.045 }, { b: 210, t: 'triangle', v: 0.11 }, { b: 78, t: 'sawtooth', v: 0.1 }, { b: 500, t: 'triangle', v: 0.09 }, { b: 250, t: 'square', v: 0.05 }];
HABLAS.forEach((h, i) => [0.82, 0.92, 1.05, 1.2].forEach((r, v) => { SONIDOS['h' + i + '_' + v] = () => tono(h.b * r, h.b * r * (v % 2 ? 1.07 : 0.94), 0.075, h.t, h.v); }));
function hablar(i, ch) {

}

// ---------- 3. CONTROLES ----------
// Teclado: flechas o A/D mover | Espacio, W o ↑ saltar | Z o K atacar | X o J poder | P o Esc pausa | M sonido
// Control (Switch, Xbox, PS): palanca/cruceta mover | A o B saltar | Y atacar | X poder | + pausa
// Pantalla táctil: los 5 botones de la pantalla.
const teclas = {}, pulsos = {}, tactil = {};

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pulsos[e.code] = true;
  teclas[e.code] = true;

addEventListener('keyup', e => teclas[e.code] = false);
const pulso = (...cods) => cods.reduce((hay, c) => { const v = pulsos[c]; pulsos[c] = false; return hay || !!v; }, false);

const pad = { held: {}, edge: {}, prev: {} };
function actualizarPad() {
  pad.held = {}; pad.edge = {};
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    p.buttons.forEach((b, i) => { if (b.pressed) pad.held[i] = true; });
    if (p.axes[0] < -0.5) pad.held[100] = true;
    if (p.axes[0] >  0.5) pad.held[101] = true;
    if (p.axes[1] < -0.5) pad.held[102] = true;
    if (p.axes[1] >  0.5) pad.held[103] = true;

// Botones táctiles: cada botón registra su dedo con "pointer events" (se pueden apretar varios a la vez)
const BOTONES = { 'b-izq': 'izq', 'b-der': 'der', 'b-salto': 'salto', 'b-patada': 'patada', 'b-poder': 'poder', 'b-dash': 'dash' };
Object.entries(BOTONES).forEach(([id, nombre]) => {
  const el = document.getElementById(id);
  const soltar = () => { tactil[nombre] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); tactilActivo = true; audio();
    try { el.setPointerCapture(e.pointerId); } catch (x) {}
    tactil[nombre] = true; el.classList.add('on');
    if (nombre === 'patada') pulsos.TactilPatada = true;
    if (nombre === 'dash') pulsos.TactilDash = true;

  el.addEventListener('contextmenu', e => e.preventDefault());
});

function leerControles() {
  const h = pad.held, e = pad.edge;
  return {
    izq: teclas.ArrowLeft || teclas.KeyA || h[14] || h[100] || tactil.izq,
    der: teclas.ArrowRight || teclas.KeyD || h[15] || h[101] || tactil.der,

function dibujarLichiDibujo(g, pj, x, y, esc, dir, pose) {
  const L = LICHI, U = L.U, st = pose.estado, t = pose.t || 0, ph = pose.fase || 0, s = Math.sin(ph), c = Math.cos(ph);
  let bob = 0, incl = 0, aT = 0, aF = 0, cab = 0, lT = { x: 0, y: 0, r: 0 }, lF = { x: 0, y: 0, r: 0 };
  if (st === 'camina') { lF = { x: 0, y: -Math.max(0, c) * 3, r: s * 0.42 }; lT = { x: 0, y: -Math.max(0, -c) * 3, r: -s * 0.42 }; bob = -Math.abs(c) * 2.4; aF = aT = -s * 0.5; incl = s * 0.03 + 0.05; }
  else if (st === 'salta') { lF = { x: 1, y: -5, r: -0.55 }; lT = { x: -1, y: -2, r: 0.4 }; aF = -1.1; aT = 1.1; }
  else if (st === 'patea') { lF = { x: 4, y: -3, r: -1.0 }; lT = { x: -2, y: 0, r: 0.1 }; aF = -0.4; aT = 0.8; incl = -0.06; }
  else { bob = Math.sin(t * 0.08) * 0.8; aF = Math.sin(t * 0.08) * 0.06; aT = -aF; cab = Math.sin(t * 0.08 + 1) * 0.015; }
  let sx = 1, sy = 1;
  if (st === 'salta') { const k = Math.max(-1, Math.min(1, (pose.vy || 0) / 12)); sy = 1 - k * 0.09; sx = 1 + k * 0.07; }

// ---------- 10. ENTRADAS Y CICLO PRINCIPAL ----------
function menuControl() {
  const e = pad.edge, ok = () => pulso('Enter', 'Space') || e[0] || e[1];

    if (pulso('ArrowLeft', 'KeyA') || e[14] || e[100]) { seleccion = (seleccion + PERSONAJES.length - 1) % PERSONAJES.length; if (desbloqueado(PERSONAJES[seleccion])) personaje = PERSONAJES[seleccion]; sfx('menu'); }
    if (pulso('ArrowRight', 'KeyD') || e[15] || e[101]) { seleccion = (seleccion + 1) % PERSONAJES.length; if (desbloqueado(PERSONAJES[seleccion])) personaje = PERSONAJES[seleccion]; sfx('menu'); }
    if (modoPers === 'elegir' && ok() && desbloqueado(PERSONAJES[seleccion])) { sfx('menu'); nuevaPartidaDesdeMenu(); }
    if (pulso('Escape', 'Backspace') || e[8]) irA('menu');

    if (pulso('Escape')) irA('menu');
    return;

  if (pulso('ArrowDown', 'KeyS') || e[13] || e[103]) { ui.foco = estado === 'tienda' ? Math.min(n - 1, ui.foco + 3) : (ui.foco + 1) % n; sfx('clic'); }

  const r = lista[ui.foco];
  if (r.tipo === 'slider') { if (izq) { r.set(pasoUI(r.get() - r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } if (der) { r.set(pasoUI(r.get() + r.paso)); sfx('clic'); if (r.suelta) r.suelta(); } }
  else if (r.tipo === 'toggle') { if (izq || der || ok()) { r.accion(); sfx('clic'); } }
  else if (ok()) { sfx('menu'); r.accion(); }

function puntoLogico(ev) { const r = canvas.getBoundingClientRect(); return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height }; }

const domTactil = document.getElementById('tactil'), domGirar = document.getElementById('girar'), domDash = document.getElementById('b-dash');

let ultimoT = 0, acum = 0, dibCont = 0, fpsT0 = 0, fpsMostrado = 60, fpsBajos = 0, domVis = null, domGir = null;
let trabAcum = 0, trabN = 0, trabMostrado = 0;
function ciclo(ts) {
